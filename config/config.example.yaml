# Switchboard configuration.
# Copy to config/config.yaml and adjust. API keys come from env vars only.

# The GitHub organization (or user) this installation serves — the account the
# GitHub App is installed on. Required. It names the shared memory scope
# (`org:<organization>`) and the About block every model run carries; nothing
# in the code assumes a particular organization.
organization: acme

providers:
  anthropic:
    wire: anthropic-messages
    apiKeyEnv: ANTHROPIC_API_KEY
    # The biller's invoice for the daily tie-out on the costs page (costs.md item
    # 4d): each block may name its own invoice API and the env var holding that
    # API's key — an admin or management key, never the inference key. This is
    # where `costs.anthropicAdminKeyEnv` moved; the old key under `costs:` is
    # still accepted for one release.
    # invoiceApi: anthropic-cost-report   # GET /v1/organizations/cost_report
    # invoiceKeyEnv: ANTHROPIC_ADMIN_KEY  # sk-ant-admin…
  # OpenAI itself runs on its Responses API (record 0052): every first-party
  # OpenAI card in pi's registry is `openai-responses`, OpenAI recommends the
  # wire for new projects, and its chat route loses tool calling with any
  # effort above `none` from GPT-5.4. The proxy serves the wire at
  # `/v1/responses` — a run on this block is pinned and metered like any other.
  # `type: openai-compatible` keeps loading as `wire: openai-chat` for one release.
  openai:
    wire: openai-responses
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
    # invoiceApi: openai-costs            # GET /v1/organization/costs, an admin key
    # invoiceKeyEnv: OPENAI_ADMIN_KEY
  # groq:
  #   wire: openai-chat
  #   baseUrl: https://api.groq.com/openai/v1
  #   apiKeyEnv: GROQ_API_KEY
  # OpenRouter: one key, many vendors' models, an aggregator (`vendor: model`
  # reads the vendor off the model id's first segment, so the card is per block
  # AND vendor: a tier the OpenRouter file refuses may be native direct).
  # `catalog: openrouter` names the pi registry file its cards come from; a
  # block named unlike its catalog still reads that file. Any preset's model
  # may be openrouter/<vendor>/<model> — e.g. openrouter/anthropic/claude-sonnet-4:
  # the first slash names this block, the rest is the model id passed through.
  # OPENROUTER_API_KEY is read at the first model call, never at load, so
  # without it every other block runs as today and only a run on this one
  # fails, by that name. `switchboard init` keeps this block only with
  # --openrouter-key.
  openrouter:
    wire: openai-chat
    vendor: model
    catalog: openrouter
    baseUrl: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    # invoiceApi: openrouter-activity     # GET /api/v1/activity, a management key;
    #                                     #   its `usage` ties against the summed BYOK
    #                                     #   fees, `byok_usage_inference` the remainder
    # invoiceKeyEnv: OPENROUTER_MANAGEMENT_KEY
    # The operator's layer over the registry card: what a run needs that no
    # layer names goes out unvouched (and a note says so on the record) until
    # an override like this pins it. `providers check` (a later unit) reads the
    # provider's own endpoint to fill these in.
    # models:
    #   deepseek/deepseek-v4.1-flash:
    #     window: 1048576
    #     capField: max_tokens
    #     levels:
    #       high: high
    #       xhigh: xhigh
    #     inputs:
    #       image: true
    #     cache: automatic
    #     # The answer shapes the card takes — a forced tool call, the one-JSON-
    #     # object text contract, or both (absent assumes both). The intake gate
    #     # refuses at load a card declaring neither under its classify default.
    #     answers: ["tool", "text"]
    # A passthrough is merged into the request body on the wires whose adapter
    # takes one — a vendor-only feature such as OpenRouter's routing, never a
    # control: it is not decided, not noted and not in the matrix, and a wrong
    # one surfaces as the provider's own error on the first turn.
    # passthrough:
    #   provider:
    #     sort: throughput
  # local:
  #   wire: openai-chat
  #   baseUrl: http://localhost:11434/v1   # Ollama

defaults:
  # Agent used when none is specified (per-channel/user/request can override).
  agent: general
  # Default model per agent, as <provider>/<model>.
  models:
    general: anthropic/claude-haiku-4-5
    coding: anthropic/claude-opus-5
    review: anthropic/claude-opus-5
    explore: anthropic/claude-opus-5 # the two-hour read-only investigation (docs/reference/specs/agent-explore.md)
  # Default model effort per agent: low | medium | high (how hard the model
  # thinks per turn; lower = much faster turns). Same layering as models —
  # per-channel/user `effort` / `efforts.<agent>` and a per-request `effort:`
  # directive override these; unset → the agent's built-in effort, else the
  # provider default. Skipped for models without effort support.
  # efforts:
  #   coding: medium
  # How much the bot says about its own doing (docs/reference/specs/routing-and-config.md
  # item 28): quiet (default) — only what needs the person: answers, verdicts,
  # refusals, questions, results, the card's progress; verbose — plus every
  # acknowledgement (a follow-up folded into a live run, a plan handed to the
  # runner, the workspace and budget on the card); debug — plus the router's
  # reason and the ledger's word. Same layering as effort: per-channel/user
  # `verbosity` and a per-request `verbosity:<level>` directive override it.
  # verbosity: quiet
  # A boundary caps what ANY run in a scope may have — never grants — on the
  # three axes of a run's profile (docs/reference/specs/routing-and-config.md item 2):
  # maxMinutes (the wall-clock budget; at least 2), maxIdentity (the credential
  # a run acts as: none < read < write) and machines (the classes its tools may
  # execute on: none, blank, repo-cold, repo-resident). Unlike every other
  # setting, boundaries INTERSECT across defaults, channel and user — the
  # smallest budget, the lowest identity, the classes every layer allows — so a
  # channel or a user can only tighten what is set here. A budget above a cap is
  # clipped (the card and the run record say so); a preset whose identity or
  # class is above a cap is refused by name before any executor exists. Absent →
  # nothing is capped and every preset runs exactly its declared profile.
  # A fourth field, `confirm`, is the front door's and caps no run: the first
  # blast-radius class a command the router bound from prose is handed back at
  # (`To run this: …`) instead of run — `write` (every write is handed back; a
  # read or a repository's own test or build runs) or `destructive` (a write
  # runs at once; only a destructive one is handed back). It intersects toward
  # caution like the run axes — a channel or a user can only ask MORE than what
  # is set here — and unset everywhere it is the built-in `write`. `exec` and
  # `never` are refused by name.
  # boundary:
  #   maxMinutes: 120
  #   maxIdentity: write
  #   machines: [none, blank, repo-cold, repo-resident]
  #   confirm: write

# PR reviews and the reading diff (docs/reference/specs/reading-diff.md). Every
# review records its full `git diff`; the ABRIDGED version (meat.dev, run on
# the bot host over the complete diff GitHub serves, with this bot's own
# Anthropic key) is on demand — `review abridge <run id>`, grant `review:write`
# — unless `provider: meat` makes it automatic after every review's record is
# written (one Opus-class call per review; meat caches by model + diff). `off`
# records no reading diff at all. `SWITCHBOARD_READING_DIFF=git|meat|off` in
# the environment overrides `provider` on a deployed bot. Needs `runHistory`.
# `addressSeverity` is the severity to address (docs/reference/specs/agent-review.md
# item 5a): a review's approve carrying a finding at or above it is posted as
# `Changes requested:`, never `LGTM:`, and agent:ship holds its rounds to the same
# level. Per channel/user: config set … --review.addressSeverity; per run:
# severity:<level>.
# review:
#   addressSeverity: minor         # blocking | major | minor (default) | nit
#   readingDiff:
#     provider: git                # git (default) | meat | off
#     meatModel: claude-opus-5     # meat's -model; Opus-class is the floor that actually abridges
#     meatTimeoutS: 240            # meat's own budget on the host; past it the abridging fails by name

# Static per-channel defaults (channel ID -> scope). Runtime overrides set via
# "config set channel ..." are stored in data/overrides.json and win over these.
# channels:
#   slack:C012345:
#     agent: review
#     models:
#       review: anthropic/claude-opus-5
#     efforts:
#       coding: medium
#     # Cap this channel's runs (see defaults.boundary): here every run acts
#     # with at most a read credential — `agent:coding` is refused by name,
#     # `agent:review` runs — and no run gets more than 45 minutes.
#     boundary:
#       maxMinutes: 45
#       maxIdentity: read

# Static per-user defaults (user ID -> scope). A user's `harness` puts that
# person's runs of a preset on another harness (docs/reference/specs/harness.md
# item 8) — every run of it they request, in any channel, and nobody else's; the
# same words as the top-level `harness` block, which they override (a channel's
# `harness` sits between). From chat: `config set me --harness.coding opencode`.
# users:
#   slack:U012345:
#     model: openai/gpt-5
#     verbosity: verbose          # hear every acknowledgement of what the bot does for you
#     harness:
#       coding: opencode
#     # The person's GitHub author binding (record 0062; authorization.md item 18):
#     # the login their commits are authored as. A bare login here is resolved to
#     # { login, id } once at first use; `config set user --user <id> --github
#     # <login>` (identity:write holders) stores the pair. Never set by the person
#     # themselves; `config clear me` keeps it. One login/id binds one person.
#     github: octocat

# Authorization (docs/reference/specs/authorization.md item 9, docs/reference/authorization.md):
# two blocks. `restrict` names what is CLOSED unless granted — an agent listed
# here runs only for an actor whose grants hold agent:run:<name> (or `all`); a
# repo listed here is used only by an actor whose `repos` axis names it (or
# `all`). Everything unlisted is open to everyone who can reach the bot.
# Enforcement is at run time against the resolved agent/repo, so it can't be
# bypassed via directives or config scopes. Names must be registered agents /
# owner/name slugs, or the load fails.
# restrict:
#   agents: [coding, conductor]   # conductor: fan-out closed unless granted (docs/reference/specs/agent-conductor.md)
#   repos: [acme/api]
#
# `grants`: what ANY actor holds, in one shape, keyed by its platform-namespaced
# id — `slack:U…`, `http:<subject>`, `mcp:<subject>`, `access:<sub>`,
# `access:svc:<common_name>`, `schedule:<name>` — or by a whole surface,
# `<ns>:*`: `access:*` is every Cloudflare Access browser session (the org,
# granted once instead of enumerated), `slack:*` every workspace member the bot
# hears, `http:*` / `mcp:*` every ingress token. Each entry has up to three
# axes; every axis is a list of names or the explicit word `all`, and an ABSENT
# axis is the empty set (fail-closed). A `slack:` user holds the open chat
# commands and every unrestricted agent whether listed or not — an entry ADDS to
# that; an Access browser session holds every group's read the same way;
# credentials (`http:`, `mcp:`, `access:svc:`) hold exactly their entry and an
# unlisted one holds nothing, not even `dispatch`. A surface entry is unioned
# into every actor of its surface on top of its own entry — a person's entry
# never narrows it; `access:*` never reaches an `access:svc:` token. `config:write`
# (channel config), `repo:write` (repo onboard/offboard/…, friction propose) and
# every `runs:*` are never a baseline: nobody holds them until granted, and
# nobody is an admin without an `all` entry. An unknown id prefix, a misspelled
# `all` or a `*` that is not a whole surface (`slack:U*`, `schedule:*`,
# `agent:*`) fails the load, as does any top-level key this file does not document.
# grants:
#   access:*:                         # everyone in the org: every Access browser session
#     actions: all                    # holds everything — the org-wide pattern
#     channels: all
#     repos: all
#   slack:U0ADMIN:                    # an admin, spelled out
#     actions: all
#     channels: all
#     repos: all
#   slack:U0456DEV:
#     actions: [agent:run:coding, repo:write, friction:write]
#     repos: [acme/api]                 # the repos this user may use
#   access:svc:ops-bot:                 # an Access service token (its common_name)
#     actions: [runs:read, runs:write, friction:read]
#     channels: all                     # sees runs from every channel
#   http:ci:                            # an ingress token's subject, as http: …
#     actions: [dispatch, runs:read]
#     channels: [http:ops]              # … the channels whose runs it may read (a
#                                       # token with no `channel` key and no entry
#                                       # here reads none — the fail-closed default)
#   mcp:ci:                             # … and the same subject over MCP
#     actions: [dispatch, runs:read]
#     channels: [mcp:ops]
#   http:cron:                          # the identity the shim fires schedules as
#     actions: [friction:read, friction:write, repo:write]
#     channels: all                     # the weekly pass analyzes the whole fleet
#   http:coordinator:                   # the ship coordinator's bearer (its own
#     actions: [coordinator:step, plan:merge]  # SWITCHBOARD_INGRESS_TOKENS entry, subject
#                                       # "coordinator", rotated apart from cron):
#                                       # coordinator:step is the one grant the
#                                       # coordinator's steps need — the child a spawn
#                                       # starts is authorized as the requesting user,
#                                       # never as this identity; plan:merge lets the
#                                       # plan runner merge a plan branch's pull request
#                                       # once the review approved at its head and CI is
#                                       # green — leave it out and every merge is a person's
#   schedule:self-improvement:          # the weekly cron's own actor (src/core/schedules.ts
#     actions: [friction:write]         # declares its grants; an entry here REPLACES them)
#     channels: all                     # analyzes the whole fleet, not one channel

# Where agent tools execute. "local" runs them on the bot host (dev/CLI);
# "e2b" runs each thread's tools in its own E2B micro-VM — the repo checkout
# and GH_TOKEN live in the sandbox, never on the bot host. Recommended for
# any deployment where untrusted users can reach the coding agent.
execution:
  type: local
  # Cloudflare Sandbox via the proxy Worker (deploy/cloudflare-sandbox/):
  # type: cloudflare
  # url: https://switchboard-sandbox.<account>.workers.dev
  # apiKeyEnv: SANDBOX_TOKEN     # bearer secret shared with the Worker
  # E2B:
  # type: e2b
  # apiKeyEnv: E2B_API_KEY
  # timeoutMinutes: 30   # sandbox idle lifetime; thread follow-ups reconnect
  # Resident repo environments (deploy/cloudflare-resident/): when set, a
  # request whose target repo is onboarded and warm runs against the resident
  # Worker; any other resident state falls back to the backend above with a
  # named reason on the status card. Works alongside any per-thread type.
  # Repos are onboarded from chat: `repo onboard <owner/name>` (see
  # docs/how-to/onboard-a-repo.md; needs the `repo:write` grant — never a
  # baseline, admins only until granted). `repo list` shows lifecycle;
  # `repo offboard`/`repo rebuild` accept --dry-run for an itemized plan
  # without executing.
  # Deterministic ops (no model turn): `repo test <owner/name> [<ref>]` /
  # `repo build <owner/name> [<ref>]` — and natural asks like "run the tests
  # on main in acme/api" — run the repo's onboarded command in a disposable
  # resident checkout and post the result with zero model calls. Operator-
  # level: gated like a coding run — `restrict.agents` / `restrict.repos`
  # against the caller's grants (NOT `repo:write`). Anything ambiguous falls through to the agent. With
  # local execution the same asks run fixed Node commands in the thread's
  # local workspace (dev-only).
  # resident:
  #   baseUrl: https://switchboard-resident.<account>.workers.dev
  #   tokenEnv: RESIDENT_OPERATOR_TOKEN  # operator bearer secret (default)
  #   adminTokenEnv: RESIDENT_ADMIN_TOKEN # admin bearer for `repo ...` commands (default)
  #   probeTimeoutMs: 8000               # /status probe deadline; a miss = not warm for that dispatch, never an outage

# Where per-conversation agent workspaces are created (local execution only).
# Under docker compose this directory is a named volume, so checkouts survive a restart.
workspaceDir: ./workspaces

# The artifact store (docs/reference/specs/execution.md item 20): one private R2
# bucket a run's files move through by reference — a screenshot a coding run
# attaches, a video a person drops on a thread. DEFAULT OFF: absent means no
# store; attach_file keeps its inline path (10 MiB cap) and an inbound video is
# skipped with its name, exactly as before. Configured, the bot signs presigned
# URLs and the container moves the bytes; the bot never holds a file. Needs
# three bot secrets — ARTIFACTS_R2_ACCESS_KEY_ID and ARTIFACTS_R2_SECRET_ACCESS_KEY
# (an R2 API token scoped Object Read & Write to this bucket only) and
# ARTIFACTS_COPY_TOKEN (self-minted, shared with the bot's own Worker) — and
# PUBLIC_BASE_URL; a configured store with any of them unset fails startup by
# name. `deploy` creates the bucket; `artifacts lifecycle` applies retention;
# `artifacts check` reads whether the bucket is private.
# artifacts:
#   r2:
#     accountId: <your Cloudflare account id>     # the S3 endpoint is <accountId>.r2.cloudflarestorage.com
#     bucket: switchboard-artifacts                 # the bot's Worker binds the same name
#   retentionDays: 30       # objects expire after this many days (default 30)
#   inbound:
#     maxBytesPerMessage: 2147483648   # the most staged bytes one message may carry (default 2 GiB)
#     copyTimeoutMs: 1200000           # how long the bot waits on one inbound copy (default 20 min)

# Cross-session self-learning memory (docs/reference/specs/memory.md). DEFAULT OFF: absent, or
# enabled:false, means the dispatcher uses a NullMemoryStore and the model input
# is byte-identical to memory-off — zero behavior change. When enabled, before
# each model turn the dispatcher retrieves scope-relevant distilled records
# (keyword + recency ranked, hard-budgeted) and injects them as a DEDICATED
# advisory context block on the system prompt ("Background memory for <resource>
# (may be outdated — verify before acting):"), never mixed into history. After
# each reply, a run that did real work (used tools, or a thread ≥4 turns deep)
# fires ONE async reflection call on `model` that distills ≤5 durable facts + 1
# summary into the store (secret-redacted, confidence-gated, dedup/supersede on
# write) — fire-and-forget, so it never delays or fails the reply. Records live
# in the Memory Worker (deploy/cloudflare-memory/: one SQLite Durable Object per
# scope, survives bot restarts); with no `worker` configured the bot falls back
# to an IN-PROCESS store and warns at startup — dev only. See docs/reference/specs/memory.md.
# memory:
#   enabled: false      # master switch (default false)
#   worker:
#     baseUrl: https://switchboard-memory.example.com
#     tokenEnv: MEMORY_TOKEN   # env var holding the Worker's bearer (default)
#   # Scopes are derived per request, not configured: every request reads the
#   # shared org scope (org:acme), the channel's scope (channel:slack:C…)
#   # and — when the run is bound to a repo — that repo's scope (repo:owner/name)
#   # plus the requesting user's own scope (user:slack:U…) — a
#   # person's records never surface for anyone else.
#   limit: 32           # max records retrieved/injected per request (default 32)
#   maxTokens: 3000     # hard token budget for the injected block (default 3000)
#   repoWindow: 24      # newest repo facts injected ahead of the keyword hits when
#                       # the run is bound to a repo (default 24; 0 disables the window)
#   maxRecordsPerScope: 500
#                       # per-scope cap on ACTIVE records (default 500): a write
#                       # that would exceed it evicts the least recently used
#                       # records (soft delete, status `evicted`) in the same write.
#   model: anthropic/claude-haiku-4-5
#                       # <provider>/<model> for the reflection pass — pick a
#                       # cheap tier. Absent → the run's own resolved model.

# Self-improvement proposals (docs/reference/specs/run-friction.md). Every finished run's friction
# diagnosis (docs/reference/specs/run-friction.md) is stored with its run record, so the
# runs these commands see are run history's (`runHistory` below; its retention
# bounds them — without `runHistory` there are no recent runs to analyze).
# `friction report` (open to everyone) shows the patterns that recur across
# recent runs; `friction propose [--dry-run]` (admin-gated like repo management)
# files the top patterns as labeled GitHub issues — evidence, affected runs, a
# concrete suggested fix — deduped against the proposals already open. It only
# ever PROPOSES: no PRs, nothing merged. Without `repo`, `friction propose`
# refuses. See docs/reference/specs/self-improvement.md.
# selfImprovement:
#   repo: acme/switchboard      # owner/name the proposals are filed against
#   label: self-improvement     # triage label (created if missing; default shown)
#   minRuns: 2                  # a pattern must recur in ≥ this many distinct runs
#   top: 3                      # proposals filed per pass

# Scheduled jobs. The schedule registry (src/core/schedules.ts) lists every
# cron the Cloudflare Worker shim runs; a `run` schedule fires as an ordinary run
# through /ingress as the `cron` identity — give that identity a token in
# SWITCHBOARD_INGRESS_TOKENS ({"…": {"subject": "cron", "channel": "cron"}}) and
# grant it what its command needs in `grants.http:cron` (`friction propose` →
# `friction:write`; a text command through /ingress is decided from the actor's
# grants like a tool call) with `channels: all` so the pass reads the fleet's
# runs, not the cron channel's own. The shim records each firing on the state Worker's
# ScheduleDO; this block tells the /runs "Scheduled" panel where to read them.
# Without it the panel lists the schedules with no firing history.
# schedules:
#   worker:
#     baseUrl: https://switchboard-memory.example.com
#     tokenEnv: MEMORY_TOKEN    # env var holding the Worker's bearer (default)

# agent:ship pipeline caps (docs/reference/specs/agent-ship.md). `agent:ship in owner/repo:
# <task>` hands the coding → review → fix loop to LGTM to the plan runner — the
# ShipCoordinator Workflow in the bot Worker, whose rounds are child runs — which
# needs the `coordinator` ingress entry, its grants, run history on the state
# Worker and PUBLIC_BASE_URL (docs/how-to/turn-features-on-and-off.md); without
# them the request is refused naming what is missing. Per unit: at most
# `maxRounds` review rounds and `maxMinutes` minutes of wall clock — whichever
# hits first ends the unit, and each child round's own budget is clipped to the
# remaining time. The pipeline is budgeted for the loop, not one round: the
# coding child's directive is additionally capped to leave two review rounds and
# one merge poll (11 minutes) on the clock, so a child that uses its whole
# budget still hands the review its time — which is why `maxMinutes` must be an
# integer >= 14 (the loop's reserve plus one round). `maxMinutes` is the ship
# preset's declared budget: a channel or user `boundary.maxMinutes` and a
# per-message `budget:` directive clip it like any preset's, and the card says
# so. Defaults shown; `maxRounds` must be an integer >= 1; any other key under
# `ship` fails the load by name.
# ship:
#   maxRounds: 3      # review rounds per unit
#   maxMinutes: 240   # the ship preset's wall-clock budget in minutes (the registry's default)
#   idleDays: 0       # days a ship unit idles instead of ending (record 0051): 0–365, 0 = today's
#                     # endings; also per channel/user (`channels.<id>.ship.idleDays`), user > channel > org

# Which harness each preset's runs are driven by, deployment-wide
# (docs/reference/specs/harness.md item 8): a mapping of preset to a harness's
# name. Two exist — `pi` (the pi coding agent, the default for every preset)
# and `opencode` (OpenCode's server, `opencode serve`) — each started inside
# the run's own execution container (or as a child of the bot for a preset
# without a workspace) with the run's model-proxy bearer as its only key, every
# tool call decided in the bot, every event on the run's record. This block is
# the defaults layer of the per-scope `harness` setting: a channel's or a
# user's `harness` (above, or `config set channel|me --harness.<preset> …`)
# overrides it for the runs in that scope, user over channel over here. A
# preset no layer names runs on pi; nothing defaults to OpenCode. A run keeps
# the harness it started on, so changing a word moves the next run, never one
# in flight. Any other word (`native`, the deleted loop; `codex`) fails the
# load naming the two, as does an unknown preset, in every layer; a
# `defaults.harness` key is refused pointing here. How-to:
# docs/how-to/put-a-preset-on-opencode.md.
# harness:
#   coding: opencode   # coding runs on OpenCode
#   review: pi         # the default, written out

# What the harness writes into pi's per-run settings for every run on pi
# (docs/reference/specs/harness-pi.md item 4): pi's compaction thresholds, in
# tokens, under pi's own names. pi compacts when the context passes the model's
# window less `reserveTokens` and keeps about `keepRecentTokens` of the newest
# turns; unset, pi's defaults stand (16384 reserved, 20000 kept) and the file
# is exactly what it was before this block existed. A reserve near the window
# makes a short run compact — what a receipt or a test of the compaction path
# wants; production leaves it unset. Positive integers only; any other shape
# or key fails the load by name.
# pi:
#   compaction:
#     reserveTokens: 150000
#     keepRecentTokens: 8000

# What the harness writes into OpenCode's per-run configuration for every run
# on OpenCode (docs/reference/specs/harness.md item 8): OpenCode's compaction
# thresholds, in tokens, under OpenCode's own names — `buffer`, the tokens kept
# free of the model's window before a compaction runs; `keepTokens`, how much
# of the newest turns it keeps. Unset, OpenCode's defaults stand and the file
# names no compaction. The OpenCode twin of the `pi` block above; positive
# integers only, any other shape or key fails the load by name.
# opencode:
#   compaction:
#     buffer: 20000
#     keepTokens: 8000

# The fan-out cap a spawning run meets (docs/reference/specs/agent-conductor.md).
# `agent:conductor` starts child runs as the person who asked — each an
# ordinary run in a thread of its own, under that person's permissions — and
# at most `maxChildren` of one run's children are live at once: a spawn past
# the cap is refused by name until a child finishes. A child cannot spawn.
# Default shown; an integer >= 1.
# spawn:
#   maxChildren: 3

# The request router (docs/reference/specs/routing-and-config.md item 21). ON BY
# DEFAULT: a plain message — no `agent:` directive, no sticky preset, no channel
# or user `agent` — asks the fast model which preset it means and runs as that
# preset, the card saying why (`routed: <reason>`) and how to run it another way.
# `ship` is never routed. The one way off, so every plain message runs
# `defaults.agent` as before the router: `auto: false`. `model` is the router's
# model; default `defaults.models.general`. `answer` is how that model answers:
# `tool` (default) forces a call to the router's `route` tool, whose schema is
# the answer, so prose cannot occur; `text` is the one-JSON-object text contract
# alone — set it for a provider or model that cannot take a forced tool call.
# `operator` is the one door's flag (routing-and-config item 29): `on`
# (default) — the operator's decision is what runs; `shadow` — one operator
# turn per admitted chat event, ahead of stage A, its decision written beside
# the routed request in the run store and nothing run from it; `off` — the
# rollback lever: it turns the operator back off after a bad day, not a choice
# to make up front. `shadow` and `on` run even under `auto: false`.
# routing:
#   auto: false
#   model: anthropic/claude-haiku-4-5
#   answer: text
#   operator: off

# The thread-reply intake gate (docs/decisions/0058-a-thread-reply-is-read-before-it-is-answered-intake-decides-whether-the-bot-was-addressed.md;
# docs/reference/specs/routing-and-config.md item 27). How an unmentioned reply
# in a channel thread the bot is part of is treated — NOTHING CALLS THE GATE
# YET; the Slack wiring lands in a later release, and until then behavior is
# unchanged whatever this block says. `threadReplies`: `classify` (the code's
# default — one cheap model turn decides whether the bot was addressed; a
# silent reply then gets no reaction, no card and no run), `mention` (only a
# mention is answered; an unmentioned reply is silent with a receipt and no
# model call) or `always` (today's answer-every-reply path, byte for byte).
# Also settable per channel and per user: `intake: { threadReplies: <mode> }`
# on a `channels.<id>` or `users.<id>` scope, user over channel over here.
# `model` is the verdict's model; default `routing.model`, else
# `defaults.models.general`. A mention, a DM and a top-level post never pass
# through the gate in any mode. A model whose operator card (`providers.<p>.
# models.<id>.answers`) declares it answers neither a forced tool call nor the
# text contract is refused at load when the default mode is `classify`.
# intake:
#   threadReplies: classify
#   model: anthropic/claude-haiku-4-5

# The orchestration plane (docs/decisions/0064-the-plane-owns-every-runs-state-a-refusal-becomes-a-queue-position-an-ending-is-judged-by-the-ledger-that-saw-it-and-a-release-is-a-quiet-window-a-person-closes.md;
# docs/reference/specs/routing-and-config.md item 31; orchestration-plane.md).
# `admission` gates the ledger object's queue decider: `off` (default) — the
# plane hears of no dispatch and nothing is posted; `shadow` — the bot posts
# its own outcome per dispatch (`proceeded`, `refused:<code>`) to the ledger
# object, which logs its decider's decision beside it — nothing runs from the
# decider; `on` — a later release's flip (the decider's answer is what runs).
# `reaskMinutes` (default 2) is the plane's one re-ask cadence, used only while
# something waits on a reporter that fell silent — a queued run waiting on a
# resident that has said nothing within the cadence gets one probe per cadence.
# `coldFallback` (default false) flips write presets back to falling cold under
# a resident condition instead of queueing at the resident stage — the rollback
# lever for the resident conditions.
# plane:
#   admission: shadow
#   reaskMinutes: 2
#   coldFallback: false

# Linked threads (docs/decisions/0037-a-linked-thread-is-quoted-not-joined.md;
# docs/reference/specs/routing-and-config.md item 22). Off by default. On, a
# permalink in a request to a thread in another PUBLIC channel the bot is a
# member of is quoted onto the request turn as an untrusted block — text only,
# at most three per request, never a private channel from elsewhere, never a
# DM or a Slack Connect channel — and the run's record and page show what was
# quoted. A bot older than 1.228.0 refuses a config that carries this key.
# references:
#   enabled: true

# Spend reporting: GET /costs (Access-gated). Optional. See docs/reference/specs/costs.md.
# costs:
#   cloudflareAccountId: <32-hex account id>
#   cloudflareAccountName: acme-infra              # optional: how the page names the account beside its share (else the id's first hex)
#   cloudflareTokenEnv: CF_ANALYTICS_TOKEN     # token with Account Analytics:Read
#   anthropicAdminKeyEnv: ANTHROPIC_ADMIN_KEY  # legacy (one release): moved to providers.anthropic.invoiceKeyEnv
#                                              #   (invoiceApi: anthropic-cost-report); still feeds the LLM line here
#   snapshot:                                  # the page serves a snapshot of both billing sources, never a live read;
#     everyHours: 24                           #   how often the bot reads them (1–168, default 24). `costs snapshot`
#                                              #   takes one now. Kept on the state Worker any `*.worker` block names
#     alertChannel: slack:C0123ABCD            #   optional: a line there after three failed takes in a row, and one
#                                              #   when a take lands again; otherwise only the page's status line says
#   groups:
#     myapp:
#       label: My App
#       workers: [myapp, myapp-worker]           # Worker script names — the attribution root: their Durable
#                                                #   Objects, their requests/CPU, and the R2 buckets named <worker>-cache
#       containerApps:                            # container application id → label (no dataset ties an app to a Worker)
#         a0000000-0000-0000-0000-000000000000: server
#       durableObjectNamespaces:                  # optional: DO namespace id → label; a namespace hosted by a listed
#         <32-hex namespace id>: server DO        #   Worker is attributed anyway, labelled by that Worker
#       r2Buckets:                                # optional: bucket name → label for buckets not named <worker>-cache
#         some-other-bucket: uploads
#       anthropicWorkspaceId: wrkspc_...          # this app's Anthropic workspace
#   prices:                                    # optional: USD per million tokens by <provider>/<model>, the ref a run's
#     openai/gpt-5:                            #   spans name — for a model the Anthropic list does not know, or to
#       input: 1.25                            #   override the list; all four kinds named (a provider with no
#       output: 10                             #   cache-write charge says 0). A model neither knows is "unpriced",
#       cacheRead: 0.125                       #   never $0, on the costs page and on a run's own page
#       cacheWrite: 0

# Run metrics (docs/reference/specs/run-metrics.md). Optional. The Analytics Engine
# dataset every finished run's point lands in — the SAME name the deployment
# profile's `metrics.dataset` binds on the state Worker as RUN_METRICS (the bot
# warns at boot when the two differ; neither side refuses to start). With the
# `costs` block's Cloudflare account and analytics token this turns the `metrics`
# capability on: `metrics trend` reads the trend report from the dataset over the
# Analytics Engine SQL API, weighted for sampling.
# metrics:
#   dataset: switchboard_runs
#   days: 30                                  # optional: the default report range in whole UTC days, 1..90

# Delivery indicators: GET /delivery and `delivery report` (docs/reference/specs/delivery.md).
# Optional. Needs a GitHub credential (the App triple or GH_TOKEN); read-only on GitHub.
# delivery:
#   repos: [acme/api, acme/web]          # the repositories the page serves; the first is its default
#                                        #   (`delivery report --repo owner/name` needs no entry here)
#   reviewers: []                        # logins whose reviews count as the review agent's verdicts,
#                                        #   beside this installation's own App identity
#   agentLogins: []                      # logins that are agents beyond the `[bot]` suffix
#   agentCoauthors: [Claude]             # `Co-Authored-By:` names that mark a commit as an agent's
#   snapshot:                            # each repository's facts are read from GitHub on an interval and
#     everyMinutes: 60                   #   served from that snapshot (its age on the page; `?fresh=1` /
#                                        #   `--fresh` read now); 5–1440 minutes, default 60. Kept on the
#                                        #   state Worker any `*.worker` block below names; in memory without one

# Dashboard authentication (docs/reference/specs/access-gate.md). Everything the dashboard
# serves — /runs*, /residents*, /costs*, /mcp/connect/*, and every /api/* command
# — sits behind ONE identity gate; `auth` picks which credential it checks:
#   access — the Cloudflare Access JWT the edge injects (ACCESS_TEAM_DOMAIN and
#            ACCESS_AUD in the environment). Production behind an Access app.
#   token  — `Authorization: Bearer <token>`, the secret read from the env var
#            `token.env` names (default DASHBOARD_TOKEN); a match is the one
#            actor `token.actor` names, granted under `grants` like any browser
#            session. For an Access-free deployment fronted by a proxy, curl or
#            a script — a bare browser cannot send the header.
#   none   — no credential; served ONLY to loopback callers on a localhost
#            deployment (PUBLIC_BASE_URL unset or naming localhost). A remote
#            caller is refused, and an explicit `none` on a deployment with a
#            public PUBLIC_BASE_URL is a startup error. Local development.
# Default when the block is absent: `access` if both ACCESS_* are set, else `none`.
# A strategy whose inputs are missing fails at startup, naming the piece.
# dashboard:
#   auth: token
#   token:
#     env: DASHBOARD_TOKEN   # env var holding the bearer (default)
#     actor: access:ops      # the actor the bearer resolves to — key its grants entry by this id

# Slack adapter — reconnect catch-up (docs/decisions/0012-reconnect-catch-up-as-recovery.md). Socket Mode drops every mention
# posted while the websocket is down (each bot deploy = drain + cold start).
# On every (re)connect the bot re-reads recent history of the channels it is in
# and runs whatever has no receipt from it (no :eyes:, no bot reply after it).
# Defaults: enabled, 30-minute window. The drain closes the socket on SIGTERM
# and the next container starts only after this one exits, so a deploy over a
# run in flight blacks Slack out for up to the 15-minute drain deadline plus a
# cold start — the window must be >= 20 minutes to cover that; a smaller
# value is kept but warned about at startup. Needs channels:read + groups:read
# (channel listing) on top of the history scopes.
# slack:
#   catchUp:
#     enabled: true
#     windowMinutes: 30
#   # The apps whose relay footer — `Sent by Claude in <#C…> on behalf of <@U…> ·
#   # <permalink>`, appended by the Claude Slack app to a post it makes from a
#   # Claude Code session — names the person the run is for and billed to
#   # (docs/reference/specs/slack-channel.md item 13). By Slack bot id: the
#   # `bot_id` on the app's messages, the `B…` a run record's `postedBy:
#   # slack:bot:B…` carries. The footer is message text any app can write, so
#   # it is read only from an app listed here; from any other app the app itself
#   # is the requester, footer or not. Absent or empty: no footer is honoured.
#   relayApps:
#     - B0123ABCDE

# Where chat-set runtime overrides (`config set`, `config instructions`, `config clear`)
# persist (docs/reference/specs/routing-and-config.md item 12). Without this block they go to
# data/overrides.json on the host disk — EPHEMERAL on Cloudflare Containers. In
# production name the state Worker's ConfigDO (same Worker + bearer as memory and
# run history); the bot and the CLI then write one versioned document.
# runtimeOverrides:
#   worker:
#     baseUrl: https://switchboard-memory.example.com
#     tokenEnv: MEMORY_TOKEN   # default

# Persistent run history (docs/reference/specs/run-history.md). Every finished run's
# record — identity, timing, terminal status, the redacted event stream, the
# friction diagnosis — is kept for a retention window instead of evicted 60 s
# after finish, and the friction ledger's "recent runs" are read from it.
# Without this block history is OFF (runs stay live-only, as before).
# runHistory:
#   retentionDays: 30    # days a finished run stays readable (1–365; default 30)
#   maxRuns: 5000        # newest runs kept (1–20000; default 5000)
#   maxBytes: 2147483648 # total stored bytes kept (16 MiB–8 GiB; default 2 GiB)
#   sessionLogMaxBytes: 209715200 # the most bytes one thread-and-agent session log holds before its
#                                 # oldest tool results are replaced by a marker (16 MiB–2 GiB; default 200 MiB)
#   includeContext: true # include the thread-context turns fed to the model in the
#                        # run stream — live page and persisted record (default true)
#   store: worker        # `worker` (default when `worker` is set) or `file` — an
#                        # explicit opt-in that writes data/runs/<id>.json on the
#                        # host disk (ephemeral on Cloudflare Containers)
#   # The durable store: a RunHistoryDO on the state Worker (deploy/cloudflare-memory/,
#   # the same Worker + bearer as memory and the friction ledger). Must be https:.
#   worker:
#     baseUrl: https://switchboard-memory.example.com
#     tokenEnv: MEMORY_TOKEN   # env var holding the Worker's bearer (default)

# External MCP servers as agent tools (docs/reference/specs/mcp-tools.md). Servers are a
# SETTING ON THE CONFIG SCOPES, not a list here: `defaults.mcpServers` (org-wide),
# `channels.<id>.mcpServers`, `users.<id>.mcpServers` — static below, or added at run
# time with `mcp add` (persisted with the other runtime overrides). A run gets the
# union of the three tiers; a name in more than one tier resolves to the highest-
# trust tier (org > channel > user). Only org entries may name coding/review/ship.
# Tools appear as `mcp__<name>__<tool>`; descriptions and results are untrusted
# data; every call is budgeted and recorded. URLs are SSRF-checked at load and at
# connect. This block turns the feature on and names the deployment knobs; without
# it MCP is off and the `mcp.*` commands answer `unavailable`.
# mcp:
#   credentialKeyEnv: MCP_CREDENTIAL_KEY   # default; 32 bytes base64 (`openssl rand -base64 32`),
#                                          # bot-only — seals tokens entered on the connect page
#   # secretsPath: ./data/mcp-secrets.json # sealed blobs + tickets when no runtimeOverrides.worker
#
# defaults:
#   mcpServers:
#     github:
#       url: https://api.githubcopilot.com/mcp/
#       auth: bearer
#       tokenEnv: MCP_GITHUB_TOKEN          # static bearer from the bot env (startup fails if unset)
#       agents: [general, research, coding] # default [general, research]
#     lake:                                  # a server behind Cloudflare Access: the gate wants a service token,
#       url: https://vega.example.com/mcp    # not an Authorization header — name the two headers and the bot
#       auth: none                           # env vars holding them (manifest secrets on Cloudflare); an unset
#       headersEnv:                          # one makes the server `unavailable` for that run, naming it
#         CF-Access-Client-Id: MCP_ACCESS_CLIENT_ID
#         CF-Access-Client-Secret: MCP_ACCESS_CLIENT_SECRET
# channels:
#   "slack:C0123":
#     mcpServers:
#       notion: { url: https://mcp.notion.so/mcp, auth: none }   # general/research only
#       vanta: { url: https://mcp.vanta.com/mcp, auth: oauth }   # OAuth 2.1: a channel-config holder signs in once via `mcp connect vanta --scope channel`
