# Switchboard configuration.
# Copy to config/config.yaml and adjust. API keys come from env vars only.

providers:
  anthropic:
    type: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY
  # Any OpenAI-compatible endpoint works with the same adapter:
  openai:
    type: openai-compatible
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
  # groq:
  #   type: openai-compatible
  #   baseUrl: https://api.groq.com/openai/v1
  #   apiKeyEnv: GROQ_API_KEY
  # local:
  #   type: openai-compatible
  #   baseUrl: http://localhost:11434/v1   # Ollama

defaults:
  # Agent used when none is specified (per-channel/user/request can override).
  agent: general
  # Default model per agent, as <provider>/<model>.
  models:
    general: anthropic/claude-haiku-4-5
    coding: anthropic/claude-opus-5
    review: anthropic/claude-opus-5

# Static per-channel defaults (channel ID -> scope). Runtime overrides set via
# "config set channel ..." are stored in data/overrides.json and win over these.
# channels:
#   slack:C0123456789:
#     agent: review
#     models:
#       review: anthropic/claude-opus-5

# Static per-user defaults (user ID -> scope).
# users:
#   slack:U0123456789:
#     model: openai/gpt-5

# Authorization (optional — absent means everything is open).
# Enforcement is at run time against the resolved agent, so allowlists can't
# be bypassed via directives or config scopes.
# permissions:
#   admins: [slack:U0123ADMIN]            # bypass all restrictions below
#   agents:
#     coding: [slack:U0456DEV]            # only these users (+ admins) may run coding
#   channelConfig: []               # who may run `config set/clear channel`;
#                                   # empty = admins only; key absent = everyone
#   repos:                          # per-repo access for resident environments;
#     acme/api: [slack:U0456DEV]    # map or key absent = open to every allowed
#                                   # coding-agent user; a listed repo refuses
#                                   # non-listed users by name (never silently)
#   repoManagement: []              # who may run `repo onboard/offboard/
#                                   # reconfigure/rebuild` (`repo list` is open).
#                                   # FAIL-CLOSED, unlike every gate above: key
#                                   # absent OR empty = ADMINS ONLY — these
#                                   # commands provision billable always-on
#                                   # compute and bind GitHub credentials

# Where agent tools execute. "local" runs them on the bot host (dev/CLI);
# "e2b" runs each thread's tools in its own E2B micro-VM — the repo checkout
# and GH_TOKEN live in the sandbox, never on the bot host. Recommended for
# any deployment where untrusted users can reach the coding agent.
execution:
  type: local
  # Cloudflare Sandbox via the proxy Worker (deploy/cloudflare-sandbox/):
  # type: cloudflare
  # url: https://switchboard-sandbox.<account>.workers.dev
  # apiKeyEnv: SANDBOX_TOKEN     # bearer secret shared with the Worker
  # E2B:
  # type: e2b
  # apiKeyEnv: E2B_API_KEY
  # timeoutMinutes: 30   # sandbox idle lifetime; thread follow-ups reconnect
  # Resident repo environments (deploy/cloudflare-resident/): when set, a
  # request whose target repo is onboarded and warm runs against the resident
  # Worker; any other resident state falls back to the backend above with a
  # named reason on the status card. Works alongside any per-thread type.
  # Repos are onboarded from chat: `repo onboard <owner/name>` (see README
  # Setup; gated by permissions.repoManagement — fail-closed, admins only when
  # unset). `repo list` shows lifecycle; `repo offboard`/`repo rebuild` accept
  # --dry-run for an itemized plan without executing.
  # Deterministic ops (no model turn): `repo test <owner/name> [<ref>]` /
  # `repo build <owner/name> [<ref>]` — and natural asks like "run the tests
  # on main in acme/api" — run the repo's onboarded command in a disposable
  # resident checkout and post the result with zero model calls. Operator-
  # level: gated by the coding-agent allowlist + permissions.repos (NOT
  # repoManagement). Anything ambiguous falls through to the agent. With
  # local execution the same asks run fixed Node commands in the thread's
  # local workspace (dev-only).
  # resident:
  #   baseUrl: https://switchboard-resident.<account>.workers.dev
  #   tokenEnv: RESIDENT_OPERATOR_TOKEN  # operator bearer secret (default)
  #   adminTokenEnv: RESIDENT_ADMIN_TOKEN # admin bearer for `repo ...` commands (default)
  #   probeTimeoutMs: 2000               # /status probe budget; timeout = not warm

# Where per-conversation agent workspaces are created (local execution only).
# On Fly.io set this to ./data/workspaces so checkouts live on the volume.
workspaceDir: ./workspaces

# Output formatting (channel-formatter feature, #76).
# output:
#   # When true, an agent's answer is converted to a channel-agnostic structured
#   # representation, zod-validated with a fixed-retry self-heal loop, then
#   # rendered by the target channel's formatter (Slack -> mrkdwn, CLI/HTTP/MCP
#   # -> plain text) — so the model never guesses per-channel markup. Default
#   # false: the Markdown answer is sent as-is (today's behavior, unchanged).
#   structured: false

# Cross-session self-learning memory (Area 7c, #85). DEFAULT OFF: absent, or
# enabled:false, means the dispatcher uses a NullMemoryStore and the model input
# is byte-identical to memory-off — zero behavior change. When enabled, before
# each model turn the dispatcher retrieves scope-relevant distilled records
# (keyword + recency ranked, hard-budgeted) and injects them as a DEDICATED
# advisory context block on the system prompt ("Background memory for <resource>
# (may be outdated — verify before acting):"), never mixed into history. After
# each reply, a run that did real work (used tools, or a thread ≥4 turns deep)
# fires ONE async reflection call on `model` that distills ≤5 durable facts + 1
# summary into the store (secret-redacted, confidence-gated, dedup/supersede on
# write) — fire-and-forget, so it never delays or fails the reply. Records live
# in the Memory Worker (deploy/cloudflare-memory/: one SQLite Durable Object per
# scope, survives bot restarts); with no `worker` configured the bot falls back
# to an IN-PROCESS store and warns at startup — dev only. See features/memory.md.
# memory:
#   enabled: false      # master switch (default false)
#   worker:
#     baseUrl: https://switchboard-memory.coreplanelabs.dev
#     tokenEnv: MEMORY_TOKEN   # env var holding the Worker's bearer (default)
#   # Scopes are derived per request, not configured: every request reads the
#   # shared org scope (org:coreplanelabs) plus the requesting user's own scope
#   # (user:slack:U…, #107) — a person's records never surface for anyone else.
#   limit: 8            # max records retrieved/injected per request (default 8)
#   maxTokens: 800      # hard token budget for the injected block (default 800)
#   model: anthropic/claude-haiku-4-5
#                       # <provider>/<model> for the reflection pass — pick a
#                       # cheap tier. Absent → the run's own resolved model.

# Self-improvement proposals (Area 7b, #84). Every finished run's friction
# diagnosis (features/run-friction.md) is appended to the friction ledger
# regardless of this block. `friction report` (open to everyone) shows the
# patterns that recur across recent runs; `friction propose [--dry-run]`
# (admin-gated like repo management) files the top patterns as labeled GitHub
# issues — evidence, affected runs, a concrete suggested fix — deduped against
# the proposals already open. It only ever PROPOSES: no PRs, nothing merged.
# Without `repo`, `friction propose` refuses. See features/self-improvement.md.
# selfImprovement:
#   repo: acme/switchboard      # owner/name the proposals are filed against
#   label: self-improvement     # triage label (created if missing; default shown)
#   minRuns: 2                  # a pattern must recur in ≥ this many distinct runs
#   top: 3                      # proposals filed per pass
#   ledgerMax: 500              # runs retained (file and Worker alike)
#   # Durable ledger: a FrictionDO on the state Worker (deploy/cloudflare-memory/,
#   # the same Worker + bearer as memory). Without it the ledger is a JSONL file
#   # on the host disk (ephemeral on Cloudflare Containers; startup warns).
#   worker:
#     baseUrl: https://switchboard-memory.coreplanelabs.dev
#     tokenEnv: MEMORY_TOKEN    # env var holding the Worker's bearer (default)
#   ledgerPath: ./data/friction.jsonl   # host-disk ledger path when no worker
