# Production configuration — baked into the image; selected via
# SWITCHBOARD_CONFIG=./config/config.production.yaml (set by the Worker shim).
# No secrets live here; keys arrive as container env from wrangler secrets.

providers:
  anthropic:
    type: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY

defaults:
  agent: general
  models:
    general: anthropic/claude-haiku-4-5
    coding: anthropic/claude-fable-5
    review: anthropic/claude-fable-5

# One authorization model (features/authorization.md item 9): what ANY actor may
# do, in one shape, keyed by its platform-namespaced id. Every axis is a list of
# names or the explicit word `all`; an ABSENT axis is the empty set (fail-closed).
# This file is native-only (authz U7 step 1, #452): there is no `permissions`
# block, so nothing here is translated — what an actor holds is exactly what its
# entry says, plus the baselines every deployment has: every Slack user holds the
# open chat commands and may run every agent (no agent is restricted here), and
# an Access browser session holds every command group's read. `config:write` is
# in NO baseline — `config set channel` is admins only — and `runs:read` is not
# in the chat baseline, so an unlisted Slack user reads no run. Each entry lists
# its actions in full; src/config.production.test.ts holds the per-actor goldens.
grants:
  # justin — everything on every axis: every action (agent:run:* included),
  # every channel's runs, every repo.
  slack:U0BMRFRLT1P:
    actions: all
    channels: all
    repos: all
  # The scheduled-run identity (#244, #395): the Worker shim fires `friction
  # propose` through /ingress as the `cron` entry of SWITCHBOARD_INGRESS_TOKENS,
  # which the dispatcher sees as `http:cron`. `friction:write` is what `friction
  # propose` needs; `repo:write` also lets it run `repo onboard/offboard/rebuild`,
  # which only the shim can trigger (it holds the token) and only with the
  # registry's command text. `channels: all` is what lets the weekly pass analyze
  # every channel's runs instead of the cron channel's own. (`dispatch` — the
  # right to start a run through /ingress — is the token's own `scopes`, not a
  # grant.)
  http:cron:
    actions: [friction:read, friction:write, repo:write]
    channels: all
  # The same reach for the schedule's own actor (src/core/schedules.ts declares
  # it; stated here too so the two cannot drift when the shim switches over).
  schedule:self-improvement:
    actions: [friction:read, friction:write, repo:write]
    channels: all
  # Cloudflare Access service token `switchboard-ops` (#157 phase 2,
  # features/access-gate.md; 1Password, Employee vault: "Switchboard:
  # ACCESS_SERVICE_TOKEN switchboard-ops"), keyed by the token's `common_name`
  # claim = its Client ID. Read on every command group over every channel — a
  # fleet ops reader, no write/exec: stopping runs, filing proposals, memory
  # forget and repo mutations stay with humans until a token is explicitly
  # granted them. Service tokens are served /api/* only — never /runs*,
  # /residents*, /costs* — and an unlisted one authenticates but holds nothing.
  access:svc:b4a6ef75a577c499ca50844d1a85a67d.access:
    actions: [runs:read, friction:read, repo:read, memory:read, schedule:read, config:read, help:read, deploy:read]
    channels: all

execution:
  type: cloudflare
  url: https://switchboard-sandbox.coreplanelabs.dev
  apiKeyEnv: SANDBOX_TOKEN
  # Resident repo environments: ACTIVE. The U7 repo/ref resolver ships as the
  # dispatcher default, so any repo-targeted request populates ctx.repo and this
  # block is selected. The bot Worker MUST have RESIDENT_OPERATOR_TOKEN set (and
  # RESIDENT_ADMIN_TOKEN for `repo` management commands) — otherwise a
  # repo-naming dispatch hard-fails ("execution.resident is configured but
  # RESIDENT_OPERATOR_TOKEN is not set") rather than falling back to the
  # per-thread sandbox above.
  resident:
    baseUrl: https://switchboard-resident.coreplanelabs.dev
    tokenEnv: RESIDENT_OPERATOR_TOKEN

workspaceDir: ./workspaces # unused with cloudflare execution; kept for fallback

# Cross-session self-learning memory (Area 7c, #85): ENABLED in prod to dogfood
# the durable store. Records live in the Memory Worker (deploy/cloudflare-memory/,
# switchboard-memory); the bot Worker MUST have MEMORY_TOKEN set. Reversible: set
# enabled:false and redeploy. See features/memory.md.
memory:
  enabled: true
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN
  # Reflection (post-run fact extraction) runs on a cheap model; the run's own
  # model is only the fallback when this is unset.
  model: anthropic/claude-haiku-4-5

# Self-improvement proposals (Area 7b, #84): `friction propose` (admin-gated)
# clusters the friction ledger across recent runs and files the top recurring
# patterns as `self-improvement` issues against this repo — deduped against
# what is already open, proposals only (no PRs, nothing merged). The ledger is
# DURABLE: a FrictionDO on the state Worker (switchboard-memory — the same Worker
# and MEMORY_TOKEN bearer as memory), so it survives container redeploys. See
# features/self-improvement.md.
selfImprovement:
  repo: coreplanelabs/switchboard
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN

# Run history (#157): every finished run becomes a durable record on the state
# Worker's RunHistoryDO (switchboard-memory, same MEMORY_TOKEN bearer), so
# /runs/<id> keeps rendering after the 60 s live window, `runs list` /
# `runs get` read it on every surface, and the friction ledger's "recent runs"
# come from it. Retention: the defaults (30 days, 5000 runs, 2 GiB); the DO
# owns the policy and sweeps every 6 h. See features/run-history.md.
runHistory:
  store: worker
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN

# Scheduled jobs (#244): the Worker shim records every cron firing on the state
# Worker's ScheduleDO; the /runs "Scheduled" panel reads the latest per schedule.
schedules:
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN

# Spend reporting (GET /costs, Access-gated). Groups map the deployed pieces to
# a name so the page — and /costs/<group>.json for agents — can be reused for
# other apps on the account later. Ids are Cloudflare container application ids
# (GET /accounts/{id}/containers/applications). Needs the CF_ANALYTICS_TOKEN
# secret (Account Analytics:Read); ANTHROPIC_ADMIN_KEY + anthropicWorkspaceId
# layer in LLM spend. See features/costs.md.
costs:
  cloudflareAccountId: 3c7b28f23cc93f09e77bb0a9ffcb7e6f
  groups:
    switchboard:
      label: Switchboard
      workers: [switchboard, switchboard-resident, switchboard-sandbox, switchboard-memory]
      containerApps:
        a0390da2-08e7-447f-aab9-f513815b9fce: bot
        a0373f6a-a87c-429c-bb96-ac378de550c9: resident
        a030b6eb-42de-4c30-ad2b-e692327ca813: sandbox
      # Durable Object namespaces (GET /accounts/{id}/workers/durable_objects/namespaces);
      # billable DO duration is reported per namespace, not per Worker.
      durableObjectNamespaces:
        5fcc0392bd4240e4910a88ecf4040b43: bot DO
        d89e62295c1f47a9b25449739e62a164: resident DOs
        b3e64f14c8914d18baae6b093ac3c4d8: resident registry DO
        f5a6c76f9c71412ca1349bd5cb72a771: sandbox DOs
        f03b679428124934b3bf85b75ae99413: memory DOs
        0ff13de1f9bd4b76a963b41e8fe92318: friction DO
      # anthropicWorkspaceId: wrkspc_...   # set once the bot's API key lives in its own Anthropic workspace

# agent:ship pipeline caps (features/agent-ship.md item 8). maxMinutes is the
# authoritative wall clock — every child run's own budget is clipped to what
# remains — and maxRounds counts review rounds. 40 min ≈ four ~10-minute
# coding+review rounds at observed live pace (the first e2e did a full round
# in ~9 min); a worst-case coding child alone can run past 30 min, so a big
# task may cap early — deliberate for now, revisit from the run pages'
# ship_round timings.
ship:
  maxRounds: 4
  maxMinutes: 40

# Durable runtime overrides (routing-and-config item 12, #405): `config set`,
# `mcp add`, and the other runtime writes go to the state Worker's ConfigDO
# (switchboard-memory, same MEMORY_TOKEN bearer) instead of the container's
# ephemeral data/overrides.json, so they survive a redeploy or restart.
runtimeOverrides:
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN

# External MCP servers as agent tools (#394, features/mcp-tools.md): turns the
# `mcp.*` commands on. No static servers here — teams add their own with
# `mcp add` (org/channel/user tiers on the config scopes). Credentials entered on
# the connect page are sealed with the bot-only MCP_CREDENTIAL_KEY secret and
# stored beside the overrides above.
mcp:
  credentialKeyEnv: MCP_CREDENTIAL_KEY
