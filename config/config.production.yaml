# Production configuration — baked into the image; selected via
# SWITCHBOARD_CONFIG=./config/config.production.yaml (set by the Worker shim).
# No secrets live here; keys arrive as container env from wrangler secrets.

providers:
  anthropic:
    type: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY

defaults:
  agent: general
  models:
    general: anthropic/claude-haiku-4-5
    coding: anthropic/claude-fable-5
    review: anthropic/claude-fable-5

permissions:
  admins: [slack:U0BMRFRLT1P] # justin
  # The scheduled-run identity (#244): the Worker shim fires `friction propose`
  # through /ingress as the `cron` entry of SWITCHBOARD_INGRESS_TOKENS, which the
  # dispatcher sees as `http:cron`. `friction propose` sits behind the fail-closed
  # repo-management gate, so the identity is granted here — this also lets it run
  # `repo onboard/offboard/rebuild`, which only the shim can trigger (it holds the
  # token) and only with the registry's command text.
  repoManagement: [http:cron]
  # No agents block: every agent is open to the whole workspace (an absent
  # allowlist key means unrestricted, enforced in ConfigService.canRunAgent).
  channelConfig: [] # admins only
  # Cloudflare Access service tokens (#157 phase 2, features/access-gate.md):
  # keyed by the token's `common_name` claim = its Client ID; the value is the
  # exact scope list it holds (unlisted tokens authenticate but hold nothing).
  # Service tokens are served /api/* only — never /runs*, /residents*, /costs*.
  # `switchboard-ops` (1Password, Employee vault: "Switchboard:
  # ACCESS_SERVICE_TOKEN switchboard-ops"): read on every command group; no
  # write/exec — stopping runs, filing proposals, memory forget and repo
  # mutations stay with humans until a token is explicitly granted them.
  serviceTokens:
    b4a6ef75a577c499ca50844d1a85a67d.access: [runs:read, friction:read, repo:read, memory:read, schedule:read, config:read, help:read, deploy:read]

execution:
  type: cloudflare
  url: https://switchboard-sandbox.coreplanelabs.dev
  apiKeyEnv: SANDBOX_TOKEN
  # Resident repo environments: ACTIVE. The U7 repo/ref resolver ships as the
  # dispatcher default, so any repo-targeted request populates ctx.repo and this
  # block is selected. The bot Worker MUST have RESIDENT_OPERATOR_TOKEN set (and
  # RESIDENT_ADMIN_TOKEN for `repo` management commands) — otherwise a
  # repo-naming dispatch hard-fails ("execution.resident is configured but
  # RESIDENT_OPERATOR_TOKEN is not set") rather than falling back to the
  # per-thread sandbox above.
  resident:
    baseUrl: https://switchboard-resident.coreplanelabs.dev
    tokenEnv: RESIDENT_OPERATOR_TOKEN

workspaceDir: ./workspaces # unused with cloudflare execution; kept for fallback

# Cross-session self-learning memory (Area 7c, #85): ENABLED in prod to dogfood
# the durable store. Records live in the Memory Worker (deploy/cloudflare-memory/,
# switchboard-memory); the bot Worker MUST have MEMORY_TOKEN set. Reversible: set
# enabled:false and redeploy. See features/memory.md.
memory:
  enabled: true
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN
  # Reflection (post-run fact extraction) runs on a cheap model; the run's own
  # model is only the fallback when this is unset.
  model: anthropic/claude-haiku-4-5

# Self-improvement proposals (Area 7b, #84): `friction propose` (admin-gated)
# clusters the friction ledger across recent runs and files the top recurring
# patterns as `self-improvement` issues against this repo — deduped against
# what is already open, proposals only (no PRs, nothing merged). The ledger is
# DURABLE: a FrictionDO on the state Worker (switchboard-memory — the same Worker
# and MEMORY_TOKEN bearer as memory), so it survives container redeploys. See
# features/self-improvement.md.
selfImprovement:
  repo: coreplanelabs/switchboard
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN

# Run history (#157): every finished run becomes a durable record on the state
# Worker's RunHistoryDO (switchboard-memory, same MEMORY_TOKEN bearer), so
# /runs/<id> keeps rendering after the 60 s live window, `runs list` /
# `runs get` read it on every surface, and the friction ledger's "recent runs"
# come from it. Retention: the defaults (30 days, 5000 runs, 2 GiB); the DO
# owns the policy and sweeps every 6 h. See features/run-history.md.
runHistory:
  store: worker
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN

# Scheduled jobs (#244): the Worker shim records every cron firing on the state
# Worker's ScheduleDO; the /runs "Scheduled" panel reads the latest per schedule.
schedules:
  worker:
    baseUrl: https://switchboard-memory.coreplanelabs.dev
    tokenEnv: MEMORY_TOKEN

# Spend reporting (GET /costs, Access-gated). Groups map the deployed pieces to
# a name so the page — and /costs/<group>.json for agents — can be reused for
# other apps on the account later. Ids are Cloudflare container application ids
# (GET /accounts/{id}/containers/applications). Needs the CF_ANALYTICS_TOKEN
# secret (Account Analytics:Read); ANTHROPIC_ADMIN_KEY + anthropicWorkspaceId
# layer in LLM spend. See features/costs.md.
costs:
  cloudflareAccountId: 3c7b28f23cc93f09e77bb0a9ffcb7e6f
  groups:
    switchboard:
      label: Switchboard
      workers: [switchboard, switchboard-resident, switchboard-sandbox, switchboard-memory]
      containerApps:
        a0390da2-08e7-447f-aab9-f513815b9fce: bot
        a0373f6a-a87c-429c-bb96-ac378de550c9: resident
        a030b6eb-42de-4c30-ad2b-e692327ca813: sandbox
      # Durable Object namespaces (GET /accounts/{id}/workers/durable_objects/namespaces);
      # billable DO duration is reported per namespace, not per Worker.
      durableObjectNamespaces:
        5fcc0392bd4240e4910a88ecf4040b43: bot DO
        d89e62295c1f47a9b25449739e62a164: resident DOs
        b3e64f14c8914d18baae6b093ac3c4d8: resident registry DO
        f5a6c76f9c71412ca1349bd5cb72a771: sandbox DOs
        f03b679428124934b3bf85b75ae99413: memory DOs
        0ff13de1f9bd4b76a963b41e8fe92318: friction DO
      # anthropicWorkspaceId: wrkspc_...   # set once the bot's API key lives in its own Anthropic workspace
