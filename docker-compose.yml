# The local loop: the same image on a dev box, or on one host a single trusted operator
# administers. Production is Cloudflare (docs/how-to/deploy.md). `docker compose up -d`.
services:
  switchboard:
    build: .
    restart: unless-stopped
    env_file: .env # SLACK_BOT_TOKEN, SLACK_APP_TOKEN, ANTHROPIC_API_KEY, GH_TOKEN, ...
    volumes:
      - ./config:/app/config:ro # config.yaml
      - switchboard-data:/app/data # runtime overrides survive restarts
      - switchboard-ws:/app/workspaces
    ports:
      - "127.0.0.1:8080:8080" # health only; Slack traffic is outbound websocket
    logging: # one JSON span line per request (config `tracing.log`); rotate so a busy month cannot fill the disk
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  switchboard-data:
  switchboard-ws:
