<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="wireGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8DC63F" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8DC63F" flood-opacity="0.25" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#374151" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background & Grid -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Logo Group -->
  <g transform="translate(120, 150) scale(1.5)">
    <!-- Grid Ports -->
    <circle cx="64" cy="64" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
    <circle cx="192" cy="192" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
    <circle cx="64" cy="128" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
    <circle cx="192" cy="128" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />

    <!-- Patch Cable -->
    <path d="M 64 192 C 64 96, 192 160, 192 64" fill="none" stroke="url(#wireGradient)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

    <!-- Plugs -->
    <g transform="translate(64, 192)">
      <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
      <circle cx="0" cy="0" r="8" fill="#8DC63F" />
    </g>
    <g transform="translate(192, 64)">
      <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
      <circle cx="0" cy="0" r="8" fill="#2DD4BF" />
    </g>
  </g>

  <!-- Typography -->
  <text x="560" y="320" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#F9FAFB" letter-spacing="-2">Switchboard</text>
  <text x="565" y="380" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#9CA3AF" letter-spacing="0">coreplanelabs / switchboard</text>
</svg>
