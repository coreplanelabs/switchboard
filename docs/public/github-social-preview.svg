<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGradientGH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="wireGradientGH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8DC63F" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glowGH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2DD4BF" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGradientGH)" />

  <!-- Centered Logo Group -->
  <g transform="translate(512, 120) scale(1)">
    <circle cx="64" cy="64" r="12" fill="#111827" stroke="#374151" stroke-width="4" />
    <circle cx="192" cy="192" r="12" fill="#111827" stroke="#374151" stroke-width="4" />
    <circle cx="64" cy="128" r="12" fill="#111827" stroke="#374151" stroke-width="4" />
    <circle cx="192" cy="128" r="12" fill="#111827" stroke="#374151" stroke-width="4" />

    <path d="M 64 192 C 64 96, 192 160, 192 64" fill="none" stroke="url(#wireGradientGH)" stroke-width="16" stroke-linecap="round" filter="url(#glowGH)" />

    <g transform="translate(64, 192)">
      <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
      <circle cx="0" cy="0" r="8" fill="#8DC63F" />
    </g>
    <g transform="translate(192, 64)">
      <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
      <circle cx="0" cy="0" r="8" fill="#2DD4BF" />
    </g>
  </g>

  <!-- Centered Text -->
  <text x="640" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Switchboard</text>
  <text x="640" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#9CA3AF">Live execution and retained run evidence</text>
</svg>
