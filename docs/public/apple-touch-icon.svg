<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="wireGradientIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8DC63F" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8DC63F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Optional Dark Background (remove for transparent PNG export) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradientIcon)" />

  <g transform="translate(100, 100) scale(1.2)">
    <circle cx="64" cy="64" r="16" fill="#1F2937" stroke="#374151" stroke-width="6" />
    <circle cx="192" cy="192" r="16" fill="#1F2937" stroke="#374151" stroke-width="6" />
    <circle cx="64" cy="128" r="16" fill="#1F2937" stroke="#374151" stroke-width="6" />
    <circle cx="192" cy="128" r="16" fill="#1F2937" stroke="#374151" stroke-width="6" />

    <path d="M 64 192 C 64 96, 192 160, 192 64" fill="none" stroke="url(#wireGradientIcon)" stroke-width="24" stroke-linecap="round" filter="url(#glowIcon)" />

    <g transform="translate(64, 192)">
      <circle cx="0" cy="0" r="28" fill="#374151" stroke="#4B5563" stroke-width="6" />
      <circle cx="0" cy="0" r="12" fill="#8DC63F" />
    </g>
    <g transform="translate(192, 64)">
      <circle cx="0" cy="0" r="28" fill="#374151" stroke="#4B5563" stroke-width="6" />
      <circle cx="0" cy="0" r="12" fill="#2DD4BF" />
    </g>
  </g>
</svg>
