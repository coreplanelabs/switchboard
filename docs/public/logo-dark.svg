<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradient for the active patch cable -->
    <linearGradient id="activeWireDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8DC63F" /> <!-- Brand Green -->
      <stop offset="100%" stop-color="#2DD4BF" /> <!-- Cyan/Teal -->
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8DC63F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Transparent Background -->
  <rect width="256" height="256" fill="transparent" />

  <!-- Switchboard Grid (Unused Ports) -->
  <circle cx="64" cy="64" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
  <circle cx="192" cy="192" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
  <circle cx="64" cy="128" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
  <circle cx="192" cy="128" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />

  <!-- The Patch Cable (Routing) -->
  <path d="M 64 192 C 64 96, 192 160, 192 64" fill="none" stroke="url(#activeWireDark)" stroke-width="16" stroke-linecap="round" filter="url(#glowDark)" />

  <!-- Plug 1 (Bottom Left) -->
  <g transform="translate(64, 192)">
    <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#8DC63F" />
  </g>

  <!-- Plug 2 (Top Right) -->
  <g transform="translate(192, 64)">
    <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#2DD4BF" />
  </g>
</svg>
