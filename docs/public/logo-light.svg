<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradient for the active patch cable -->
    <linearGradient id="activeWireLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65A30D" /> <!-- Deeper Green for light bg -->
      <stop offset="100%" stop-color="#0D9488" /> <!-- Deeper Teal for light bg -->
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Transparent Background -->
  <rect width="256" height="256" fill="transparent" />

  <!-- Switchboard Grid (Unused Ports) -->
  <circle cx="64" cy="64" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />
  <circle cx="192" cy="192" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />
  <circle cx="64" cy="128" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />
  <circle cx="192" cy="128" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />

  <!-- The Patch Cable (Routing) -->
  <path d="M 64 192 C 64 96, 192 160, 192 64" fill="none" stroke="url(#activeWireLight)" stroke-width="16" stroke-linecap="round" filter="url(#glowLight)" />

  <!-- Plug 1 (Bottom Left) -->
  <g transform="translate(64, 192)">
    <circle cx="0" cy="0" r="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#65A30D" />
  </g>

  <!-- Plug 2 (Top Right) -->
  <g transform="translate(192, 64)">
    <circle cx="0" cy="0" r="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#0D9488" />
  </g>
</svg>
