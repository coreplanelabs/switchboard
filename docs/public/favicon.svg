<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>.dark { display: none; } @media (prefers-color-scheme: dark) { .light { display: none; } .dark { display: inline; } }</style>
  <g class="light"><defs>

    <linearGradient id="activeWireLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>


    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>


  <rect width="256" height="256" fill="transparent" />


  <circle cx="64" cy="64" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />
  <circle cx="192" cy="192" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />
  <circle cx="64" cy="128" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />
  <circle cx="192" cy="128" r="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="4" />


  <path d="M 64 192 C 64 96, 192 160, 192 64" fill="none" stroke="url(#activeWireLight)" stroke-width="16" stroke-linecap="round" filter="url(#glowLight)" />


  <g transform="translate(64, 192)">
    <circle cx="0" cy="0" r="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#65A30D" />
  </g>


  <g transform="translate(192, 64)">
    <circle cx="0" cy="0" r="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#0D9488" />
  </g></g>
  <g class="dark"><defs>

    <linearGradient id="activeWireDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8DC63F" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>


    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8DC63F" flood-opacity="0.3" />
    </filter>
  </defs>


  <rect width="256" height="256" fill="transparent" />


  <circle cx="64" cy="64" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
  <circle cx="192" cy="192" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
  <circle cx="64" cy="128" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />
  <circle cx="192" cy="128" r="12" fill="#1F2937" stroke="#374151" stroke-width="4" />


  <path d="M 64 192 C 64 96, 192 160, 192 64" fill="none" stroke="url(#activeWireDark)" stroke-width="16" stroke-linecap="round" filter="url(#glowDark)" />


  <g transform="translate(64, 192)">
    <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#8DC63F" />
  </g>


  <g transform="translate(192, 64)">
    <circle cx="0" cy="0" r="20" fill="#374151" stroke="#4B5563" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#2DD4BF" />
  </g></g>
</svg>
