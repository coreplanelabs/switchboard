name: staging acceptance

# Updates commit statuses only; never checks out candidate code or artifacts.
on: # zizmor: ignore[dangerous-triggers]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_run:
    workflows: [deploy staging]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: staging-status-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  queue: max
  cancel-in-progress: false

jobs:
  check:
    name: ${{ github.event_name == 'pull_request' && 'staging / Review E2E' || 'staging / publish Review result' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    steps:
      - name: publish release acceptance from the trusted controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY;
          const branch = 'release-please--branches--main--components--switchboard';
          const path = '.github/workflows/deploy-staging.yml';
          const isRelease = pull => pull.state === 'open' && pull.head.ref === branch &&
            pull.head.repo.full_name === repo && pull.base.repo.full_name === repo && pull.base.ref === 'main';
          const origin = event.workflow_run;
          if (origin && (origin.path !== path || origin.head_branch !== branch ||
              origin.repository.full_name !== repo || origin.head_repository.full_name !== repo)) process.exit(0);
          if (!origin && !isRelease(event.pull_request)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Not required for an ordinary PR.\n');
            process.exit(0);
          }
          const sha = origin?.head_sha ?? event.pull_request.head.sha;
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Missing exact release head');
          function api(endpoint, body) {
            const args = ['api', `repos/${repo}/${endpoint}`];
            if (body) args.push('--method', 'POST', '--input', '-');
            return JSON.parse(execFileSync('gh', args, { encoding: 'utf8', input: body && JSON.stringify(body) }));
          }
          function publish(state, description, source) {
            api(`statuses/${sha}`, { context: 'staging / Review E2E', state, description,
              ...(source && { target_url: `${source.html_url}/attempts/${source.run_attempt}` }) });
          }
          // Invalidate prior success before any read that can fail.
          publish('pending', 'Refreshing release staging acceptance');
          const pulls = origin
            ? api(`pulls?state=open&head=${repo.split('/')[0]}:${branch}&per_page=100`)
            : [api(`pulls/${event.pull_request.number}`)];
          const release = pulls.find(isRelease);
          const candidateWasCurrent = Boolean(release && release.head.sha === sha);
          const workflow = api('actions/workflows/deploy-staging.yml');
          function newest() {
            const history = api(`actions/workflows/deploy-staging.yml/runs?head_sha=${sha}&per_page=100`);
            if (!Number.isInteger(history.total_count) || history.total_count !== history.workflow_runs.length)
              throw new Error('Controller history is incomplete');
            const runs = history.workflow_runs.filter(run => run.head_branch === branch && run.head_sha === sha &&
              run.workflow_id === workflow.id && run.path === path &&
              run.repository.full_name === repo && run.head_repository.full_name === repo &&
              !(run.event === 'pull_request_target' && run.display_title === 'Staging label ignored'));
            for (const run of runs) {
              if (!Number.isFinite(Date.parse(run.run_started_at ?? run.created_at)))
                throw new Error('Controller execution time is missing');
            }
            runs.sort((a, b) => Date.parse(b.run_started_at ?? b.created_at) - Date.parse(a.run_started_at ?? a.created_at));
            if (runs.length > 1 && (runs[0].run_started_at ?? runs[0].created_at) === (runs[1].run_started_at ?? runs[1].created_at))
              throw new Error('Controller execution order is ambiguous');
            return runs[0];
          }
          function liveReviewResult(source) {
            const jobs = api(`actions/runs/${source.id}/attempts/${source.run_attempt}/jobs?per_page=100`);
            const refuse = description => ({ state: 'failure', description });
            if (!Array.isArray(jobs.jobs) || !Number.isInteger(jobs.total_count) || jobs.total_count !== jobs.jobs.length)
              return refuse('Live Review outcome evidence is incomplete');
            const fullStackJobs = jobs.jobs.filter(job => job.name === 'staging / full stack');
            const acceptanceJobs = jobs.jobs.filter(job => job.name === 'staging / live Review');
            if (fullStackJobs.length !== 1 || acceptanceJobs.length !== 1)
              return refuse('Live Review outcome evidence is incomplete');
            const fullStack = fullStackJobs[0];
            const acceptance = acceptanceJobs[0];
            if (fullStack.status === 'completed' && fullStack.conclusion === 'skipped')
              return refuse('Live Review acceptance did not run');
            if (!Array.isArray(fullStack.steps)) return refuse('Live Review outcome evidence is incomplete');
            const deploySteps = fullStack.steps.filter(step => step.name === 'deploy the captured commit to staging');
            const reviewSteps = fullStack.steps.filter(step => step.name === 'run live Review acceptance on the deployed stack');
            if (deploySteps.length !== 1 || reviewSteps.length !== 1)
              return refuse('Live Review outcome evidence is incomplete');
            const deployment = deploySteps[0];
            const review = reviewSteps[0];
            if (review.status === 'completed' && review.conclusion === 'skipped')
              return refuse(['failure', 'cancelled', 'timed_out'].includes(deployment.conclusion)
                ? 'Staging deployment did not complete; live Review acceptance did not run'
                : 'Live Review acceptance did not run');
            if (review.status !== 'completed' || !review.conclusion)
              return refuse('Live Review outcome evidence is incomplete');
            if (review.conclusion === 'failure') return refuse('Live Review acceptance failed');
            if (review.conclusion !== 'success') return refuse('Live Review acceptance did not complete');
            if (
              deployment.status !== 'completed' || deployment.conclusion !== 'success' ||
              fullStack.status !== 'completed' || fullStack.conclusion !== 'success'
            ) return refuse('Full-stack staging did not complete successfully');
            if (acceptance.status === 'completed' && acceptance.conclusion === 'failure')
              return refuse('Live Review step passed; final acceptance gate failed');
            if (acceptance.status !== 'completed' || acceptance.conclusion !== 'success')
              return refuse('Live Review outcome evidence is incomplete');
            if (source.conclusion !== 'success') return refuse('Staging controller did not complete successfully');
            return { state: 'success', description: 'Release staging Review acceptance passed' };
          }
          let source;
          try {
            source = newest();
          } catch (error) {
            // Incomplete evidence must remain a merge refusal.
            publish('failure', candidateWasCurrent
              ? 'Controller history cannot establish release acceptance'
              : 'Candidate superseded; controller history cannot establish release acceptance', origin);
            throw error;
          }
          let state = 'failure';
          let description = 'No trusted release staging acceptance';
          if (source?.event === 'pull_request_target' && source.display_title === 'Staging requested') {
            if (source.status !== 'completed') {
              state = 'pending';
              description = 'Newest staging controller is still running';
            } else {
              try {
                ({ state, description } = liveReviewResult(source));
              } catch {
                description = 'Live Review outcome evidence is unavailable';
              }
            }
          }
          // A concurrent start or rerun must not receive an earlier execution's result.
          const latest = newest();
          const current = source && api(`actions/runs/${source.id}`);
          if (latest?.id !== source?.id || latest?.run_attempt !== source?.run_attempt ||
              current?.run_attempt !== source?.run_attempt || current?.status !== source?.status) {
            state = 'pending';
            description = 'Staging controller execution changed during verification';
          }
          let candidateIsCurrent = candidateWasCurrent;
          let candidateWasSuperseded = Boolean(release && release.head.sha !== sha);
          if (release) {
            try {
              const currentPull = api(`pulls/${release.number}`);
              candidateIsCurrent = isRelease(currentPull) && currentPull.head.sha === sha;
              candidateWasSuperseded = isRelease(currentPull) && currentPull.head.sha !== sha;
            } catch {
              state = 'failure';
              description = 'Current release head evidence is unavailable';
            }
          }
          if (!candidateIsCurrent) {
            const outcome = state === 'success'
              ? 'prior Review passed on obsolete head'
              : `${description[0].toLowerCase()}${description.slice(1)}`;
            state = 'failure';
            const disposition = candidateWasSuperseded
              ? candidateWasCurrent ? 'Candidate superseded during verification' : 'Candidate superseded'
              : 'Candidate is no longer current';
            description = `${disposition}; ${outcome}`;
          }
          publish(state, description, source);
          NODE
