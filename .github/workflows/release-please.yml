# Releases from conventional commits. Every merge to main updates (or opens)
# one release PR carrying the next version and the changelog entry; merging
# that PR tags the version and publishes the GitHub release. Nothing is built
# or pushed here — image publishing hangs off the release event separately.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
