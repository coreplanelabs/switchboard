# Releases from conventional commits, and the production deploy that follows
# them (features/release-and-deploy.md). Every merge to main updates (or opens)
# one release PR carrying the next version and the changelog entry; merging
# that PR tags the version, publishes the GitHub release — and deploys
# production: deploy-production.yml runs `deploy all --affected`, so only the
# Workers whose inputs this release changed roll, in the one supported order.
# The release PR itself shows that plan before anyone merges it: the
# release-pr-deploy-targets job below posts it on every push to main.
#
# release-please acts as the coreplane-infra GitHub App, not as GITHUB_TOKEN —
# the same identity nominal and cli release with. A release PR opened with
# GITHUB_TOKEN gets `pull_request` runs that sit at `action_required` until a
# person clicks "Approve and run" on every head (v0.2.0–v0.4.0 each cost that
# click); one opened by the App runs its CI like any other PR, so the required
# checks report and the release merges unattended. The App's credentials live
# in 1Password (CI vault, item `coreplane-bot`), read with the org's
# OP_SERVICE_ACCOUNT_TOKEN; the token minted here is scoped to this repository
# and to the two permissions release-please needs.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # release-please writes with the App token, not GITHUB_TOKEN (see the header).
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: load the App's credentials from 1Password
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
          # Pin the op CLI the action installs (its default is "latest").
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # op://<vault>/<item>/<field>
          COREPLANE_CLIENT_ID: op://CI/coreplane-bot/client-id
          COREPLANE_PRIVATE_SIGNING_KEY: op://CI/coreplane-bot/private-key
      - name: mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.COREPLANE_CLIENT_ID }}
          private-key: ${{ env.COREPLANE_PRIVATE_SIGNING_KEY }}
          # No owner/repositories: the token is scoped to this repository.
          # contents for the release branch, tag and GitHub release;
          # pull-requests for the release PR and its labels.
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR carries its deploy plan (features/release-and-deploy.md
  # item 8). Posted from HERE, on the push to main that opened or updated the
  # release PR: the PR's own `deploy targets` job judges a diff against its
  # base, while the release needs judging against PRODUCTION — each Worker's
  # live commit — and re-rendering on every merge to main, which this push is.
  # The plan is `deploy plan --affected` on the release branch's tree — main
  # plus the release commit.
  release-pr-deploy-targets:
    name: the release PR carries its deploy plan
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The same script as ci.yml's `deploy targets` job (scripts/deploy-targets.mjs),
    # in its release-PR mode: judge against production, upsert the sticky comment.
    env:
      RELEASE_PR: "true"
      # Optional: lets the plan read the sandbox's live commit; without it the
      # sandbox is judged against the last release tag (unsure before the first).
      SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # `pr` is release-please's PullRequest JSON ({ number, headBranchName, … }).
      # Read here and not at the workflow level: the job's `if` guarantees it is set.
      PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          # Full history + tags: the diff against each Worker's live commit, and
          # the last `v*` tag as the fallback base.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run deploy:targets

  # Only when this push IS the release (the release PR merged): the ordinary
  # merge to main that merely updates the release PR deploys nothing.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy-production.yml
    # `actions: write` is the ceiling for the called workflow's own permissions:
    # a deploy the bot's in-flight runs held up dispatches its own retry.
    permissions:
      contents: read
      actions: write
    with:
      targets: affected
    secrets: inherit
