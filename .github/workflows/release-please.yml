# Releases from conventional commits, and the production deploy that follows
# them (docs/reference/specs/release-and-deploy.md). Every merge to main updates (or opens)
# one release PR carrying the next version and the changelog entry; merging
# that PR tags the version, publishes the GitHub release — and deploys
# production: deploy-production.yml runs `deploy all --affected`, so only the
# Workers whose inputs this release changed roll, in the one supported order.
# The release PR itself shows that plan before anyone merges it: the
# release-pr-deploy-targets job below posts it on every push to main.
# The same release publishes the three container images to GitHub Container
# Registry (publish-image below, one matrix leg each): the bot's as
# `ghcr.io/<owner>/<repo>`, the resident's and the sandbox's under that name
# plus `-resident` / `-sandbox`, each at `:<version>` and `:latest`, with a
# build-provenance attestation and an SBOM. The bot's serves the local loop
# (docker-compose.yml); all three serve an installation that deploys published
# images instead of building them — `deploy all` copies them into its Cloudflare
# account registry over HTTPS (docs/decisions/0027-images-copied-into-the-account-registry.md,
# docs/decisions/0030-deploy-all-copies-the-images-it-needs.md).
# This project's own deploy builds each Dockerfile with wrangler instead, so a
# failed publish never blocks the deploy, and vice versa. And it publishes the
# CLI to npm (publish-npm below), the package an operator runs `init` from
# without a checkout.
#
# release-please acts as our GitHub App, not as GITHUB_TOKEN. A release PR
# opened with GITHUB_TOKEN gets `pull_request` runs that sit at
# `action_required` until a person clicks "Approve and run" on every head; one
# opened by the App runs its CI like any other PR, so the required checks
# report and the release merges unattended. The App's credentials live in the
# secrets manager the step below reads with OP_SERVICE_ACCOUNT_TOKEN; the token
# minted here is scoped to this repository and to the two permissions
# release-please needs.
# Two release lines share this workflow (docs/reference/specs/release-and-deploy.md
# item 28): `main` is the 1.1x line and `v1.2` the 1.2 line, released as 1.200.0
# and up from its own config and manifest files so the two pins never meet.
# Only `main` deploys production, tags `:latest`, publishes npm `latest` and
# judges its release PR against production; a `v1.2` release publishes its
# images at `:<version>` alone and, when publishing is on, the package under
# npm's `next` tag.
name: release-please

on:
  push:
    branches: [main, v1.2]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # release-please writes with the App token, not GITHUB_TOKEN (see the header).
    permissions:
      contents: read
    # Whichever attempt succeeded speaks (the first when it did; else the retry).
    # The line's own config and manifest (the header): `v1.2` never reads main's pin.
    env:
      RP_CONFIG: ${{ github.ref == 'refs/heads/v1.2' && 'release-please-config.v1.2.json' || 'release-please-config.json' }}
      RP_MANIFEST: ${{ github.ref == 'refs/heads/v1.2' && '.release-please-manifest.v1.2.json' || '.release-please-manifest.json' }}
    outputs:
      release_created: ${{ steps.release.outcome == 'success' && steps.release.outputs.release_created || steps.release-retry.outputs.release_created }}
      tag_name: ${{ steps.release.outcome == 'success' && steps.release.outputs.tag_name || steps.release-retry.outputs.tag_name }}
      prs_created: ${{ steps.release.outcome == 'success' && steps.release.outputs.prs_created || steps.release-retry.outputs.prs_created }}
      pr: ${{ steps.release.outcome == 'success' && steps.release.outputs.pr || steps.release-retry.outputs.pr }}
    steps:
      - name: load the App's credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
          # Pin the op CLI the action installs (its default is "latest").
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_CLIENT_ID: op://CI/coreplane-bot/client-id
          APP_PRIVATE_KEY: op://CI/coreplane-bot/private-key
      - name: mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          # No owner/repositories: the token is scoped to this repository.
          # contents for the release branch, tag and GitHub release;
          # pull-requests for the release PR and its labels.
          permission-contents: write
          permission-pull-requests: write
      # Two attempts, because GitHub refuses the release-branch ref update now and
      # then — the identical call succeeded minutes later with nothing changed on
      # our side (no rule, no permission, no incident), and the action reports only
      # "Error updating ref", the HTTP reason swallowed. A refusal costs one retry
      # and leaves a warning on the run; a second refusal is the run's failure.
      - id: release
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The pushed branch, explicitly: left unset, the action reads the config
          # and manifest from the DEFAULT branch, where the v1.2 files do not exist.
          target-branch: ${{ github.ref_name }}
          config-file: ${{ env.RP_CONFIG }}
          manifest-file: ${{ env.RP_MANIFEST }}
      - id: release-retry
        if: steps.release.outcome == 'failure'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The pushed branch, explicitly: left unset, the action reads the config
          # and manifest from the DEFAULT branch, where the v1.2 files do not exist.
          target-branch: ${{ github.ref_name }}
          config-file: ${{ env.RP_CONFIG }}
          manifest-file: ${{ env.RP_MANIFEST }}
      - name: the first attempt failed
        # `always()`: without a status function GitHub ANDs `success()` in, and
        # this step would be skipped exactly when the retry failed too.
        if: always() && steps.release.outcome == 'failure'
        run: echo "::warning title=release-please retried::the first release-please attempt failed (its step above has the message) and the retry ${{ steps.release-retry.outcome }}. GitHub refused the release-branch update once; the retry's outputs drive this run."
      # A skipped job has no log, so the one line saying why the package was not
      # published lives here, on the release that would have published it.
      - name: npm publish is off
        if: always() && (steps.release.outcome == 'success' && steps.release.outputs.release_created || steps.release-retry.outputs.release_created) == 'true' && vars.SWITCHBOARD_PUBLISH_NPM != 'true'
        run: echo "::notice title=npm publish is off::this release does not publish the npm package — set the repository variable SWITCHBOARD_PUBLISH_NPM to true (and the NPM_TOKEN secret) to turn the publish-npm job on."

  # The release PR carries its deploy plan (docs/reference/specs/release-and-deploy.md
  # item 8). Posted from HERE, on the push to main that opened or updated the
  # release PR: the PR's own `deploy targets` job judges a diff against its
  # base, while the release needs judging against PRODUCTION — each Worker's
  # live commit — and re-rendering on every merge to main, which this push is.
  # The plan is `deploy plan --affected` on the release branch's tree — main
  # plus the release commit.
  release-pr-deploy-targets:
    name: the release PR carries its deploy plan
    needs: release-please
    # Only where a production profile is configured (the repository variable);
    # a fork that never deploys from CI has no production to judge against.
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.release_created != 'true' && vars.SWITCHBOARD_DEPLOY_PROFILE != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The same script as ci.yml's `deploy targets` job (scripts/deploy-targets.mjs),
    # in its release-PR mode: judge against production, upsert the sticky comment.
    env:
      RELEASE_PR: "true"
      # A stalled npm-cache segment gives up after 1 min, not 10 (see ci.yml).
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      # Optional: lets the plan read the sandbox's live commit; without it the
      # sandbox is judged against the last release tag (unsure before the first).
      SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # `pr` is release-please's PullRequest JSON ({ number, headBranchName, … }).
      # Read here and not at the workflow level: the job's `if` guarantees it is set.
      PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          # Full history + tags: the diff against each Worker's live commit, and
          # the last `v*` tag as the fallback base.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Judging against PRODUCTION needs production's profile (each Worker's
      # live /healthz) — it lives in the installation's configuration repository
      # (the SWITCHBOARD_DEPLOY_PROFILE variable), read with a read-only App
      # token minted for that repository alone.
      - name: load the App's credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_CLIENT_ID: op://CI/coreplane-bot/client-id
          APP_PRIVATE_KEY: op://CI/coreplane-bot/private-key
      - name: mint the App token that reads the configuration repository
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ vars.CONFIG_REPO_OWNER }}
          repositories: ${{ vars.CONFIG_REPO_NAME }}
          permission-contents: read
      - run: npm run deploy:targets
        env:
          SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_DEPLOY_PROFILE }}
          CONFIG_REPO_TOKEN: ${{ steps.infra-token.outputs.token }}

  # Only when this push IS the release (the release PR merged): the ordinary
  # merge to main that merely updates the release PR deploys nothing. And only
  # on `main`: a `v1.2` release is cut and published, never deployed from here.
  deploy:
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      contents: read
    with:
      targets: affected
    secrets: inherit

  # The same release publishes the three images (docs/reference/specs/release-and-deploy.md
  # item 21), one leg per image: each Dockerfile from the context its
  # `check:image` proves on every PR and wrangler builds on this project's own
  # deploy. Independent of `deploy`: that deploy builds the Dockerfiles and never
  # pulls these images, so neither job waits on or fails with the other. The
  # image names are derived from the repository — a fork publishes under its own
  # owner without editing this file — and lowercased, since a registry path must
  # be and a GitHub owner need not be; the suffixes are the ones
  # `check:project-facts` holds project.json's `images` to. `packages: write`
  # (and the attestation scopes) are granted to this job alone; the workflow
  # stays `contents: read`.
  publish-image:
    name: publish the ${{ matrix.image.name }} image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: bot, context: ., suffix: "" }
          - { name: resident, context: deploy/cloudflare-resident, suffix: -resident }
          - { name: sandbox, context: deploy/cloudflare-sandbox, suffix: -sandbox }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: name the image from the repository
        id: image
        # `${VAR,,}` is bash's lowercase; the tag is `v<version>`, the image tag
        # is the bare version.
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SUFFIX: ${{ matrix.image.suffix }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # `:latest` follows the 1.1x line: the local loop pulls it, and a 1.2xx
      # release must not move it. On `v1.2` the version tag is the only tag.
      - name: the tags this line publishes
        id: tags
        env:
          NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          LATEST: ${{ github.ref == 'refs/heads/main' }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${NAME}:${VERSION}"
            if [ "$LATEST" = "true" ]; then echo "${NAME}:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The Dockerfile in the matrix context — the repository root for the
          # bot, the Worker's directory for the resident and the sandbox — the
          # same build `check:image -w deploy/<worker>` proves on every PR.
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # SLSA provenance and an SPDX SBOM, attached to the image index in the
          # registry (`docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'`).
          provenance: mode=max
          sbom: true
      # The signed attestation, on the digest the build pushed: a tag moves, a
      # digest does not, so `gh attestation verify oci://<name>:<version>`
      # resolves the tag to this digest and checks it against this workflow.
      # Two attempts, on the SAME digest: the attestation service has refused a
      # first attempt transiently with the image already pushed, and re-running
      # the leg would rebuild — the images are not reproducible — and push a
      # second, unattested digest. So the retry is one more attest step here;
      # a first attempt that succeeded never runs it, and a second refusal is the
      # leg's failure. No storage record: the action's record store needs a
      # permission this job does not grant, and the attestation in the registry
      # is what `gh attestation verify` reads.
      - id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - id: attest-retry
        if: steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: the first attestation failed
        # `always()`: without it GitHub ANDs `success()` in, and this step would be skipped exactly when the retry failed too.
        if: always() && steps.attest.outcome == 'failure'
        run: echo "::warning title=attestation retried::the first attestation of ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }} failed (its step above has the message) and the retry ${{ steps.attest-retry.outcome }}. The image itself was pushed once; the retry attests that same digest."

  # The same release publishes the CLI to npm (docs/reference/specs/packaging.md
  # item 5): the package under packages/switchboard, whose version the release
  # commit already carries (release-please-config.json's extra files), built by
  # its own script and published with npm's provenance attestation — which is
  # what `id-token: write` is for, and the only scope this job holds beyond
  # reading the tree. The token is NPM_TOKEN, a granular access token with
  # publish rights on the package's scope, set once as a repository secret by a
  # person; npm reads it as NODE_AUTH_TOKEN for the registry setup-node names.
  # Independent of `deploy` and `publish-image` like they are of each other.
  # OFF until the owner turns it on: the job runs only when the repository
  # variable SWITCHBOARD_PUBLISH_NPM is the string `true` — unset, the job is
  # skipped and the `npm publish is off` step above says so in one line — so a
  # release never publishes to the registry before someone decides it should.
  publish-npm:
    name: publish the npm package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.SWITCHBOARD_PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w packages/switchboard
      # `latest` follows the 1.1x line; a 1.2xx version publishes under `next`.
      - run: npm publish --workspace packages/switchboard --provenance --access public --tag ${{ github.ref == 'refs/heads/main' && 'latest' || 'next' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
