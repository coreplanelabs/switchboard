# OpenSSF Scorecard: supply-chain health checks (pinned dependencies, branch
# protection, dangerous workflow patterns, token permissions, ...). Runs on
# main and weekly; results are published to the Scorecard API and uploaded to
# code scanning so the badge and the Security tab stay current.
#
# Publishing and the SARIF upload both need a public repository; on a private
# one the workflow still runs the checks and prints the results, so a fork can
# see its score without failing the run.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: visibility
        name: is the repository public?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          echo "private=$private" >> "$GITHUB_OUTPUT"
      - name: run analysis
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ steps.visibility.outputs.private == 'false' }}
      - name: keep the results as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: upload to code scanning
        if: steps.visibility.outputs.private == 'false'
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          sarif_file: results.sarif
