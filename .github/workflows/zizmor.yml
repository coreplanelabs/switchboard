# Static analysis of the workflows themselves (zizmor: template injection,
# credential persistence, excessive permissions, cache poisoning, …). The
# workflows are this repository's most privileged surface — the deploy and the
# release run under them — so they get a linter of their own, on every PR and
# on main. Findings a workflow carries on purpose are ignored INLINE, next to
# the line, with the reason (`# zizmor: ignore[rule]`); this job stays at zero
# findings, so a new one is a red check, not a note nobody reads.
#
# The action runs zizmor's container image by digest (docker, like the image
# legs in ci.yml); both the action and the zizmor version are pinned, so what
# audits the workflows is as reviewed as what they run. Annotations instead of
# the code-scanning upload: annotations need no extra permission and fail the
# job on findings, which is the point of a gate.
name: zizmor

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: namespace-profile-mid
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          persona: regular
          advanced-security: false
          annotations: true
