# Static analysis of the TypeScript across the repo. Runs on every PR, on
# main, and weekly so newly published queries are applied to unchanged code.
#
# Code scanning is a GitHub Advanced Security feature: free on public repos,
# unavailable on a private one without a GHAS seat. The `visibility` job asks
# the API once; on a private repository the `analyze` job is SKIPPED (grey in
# the checks list, never a green that did nothing). Do not make `analyze` a
# required status check before the repository is public — a skipped required
# check satisfies branch protection, so requiring it would be vacuous.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  visibility:
    name: is the repository public?
    runs-on: namespace-profile-smidge
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" = "true" ]; then
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::warning::private repository — code scanning needs GitHub Advanced Security; the analyze job is skipped, not passed"
          else
            echo "public=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: analyze javascript-typescript
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: namespace-profile-mid
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
