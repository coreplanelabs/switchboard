name: verify-sandbox

on:
  workflow_dispatch:
    inputs:
      verifier-commit:
        description: Qualified main commit containing this verifier
        type: string
        required: true
      expected-commit:
        description: Existing Worker commit to verify, independent of verifier source
        type: string
        required: true
      mode:
        description: Inspect modes are read-only; public metadata has no readiness credit; probe authorizes echo
        type: choice
        options: [inspect, inspect-public, inventory, probe]
        default: inspect
      expected-app-version:
        description: Application version pinned after independent image qualification
        type: string
      expected-image:
        description: Independently qualified image digest (sha256:...) or digest-pinned reference
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: depot-ubuntu-24.04-4
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      VERIFIER_COMMIT: ${{ inputs.verifier-commit }}
      EXPECTED_COMMIT: ${{ inputs.expected-commit }}
      EXPECTED_APP_VERSION: ${{ inputs.expected-app-version }}
      EXPECTED_IMAGE: ${{ inputs.expected-image }}
      MODE: ${{ inputs.mode }}
      SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_DEPLOY_PROFILE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
      CI: "1"
    steps:
      - name: exact verifier and target
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ] || ! [[ "$VERIFIER_COMMIT" =~ ^[a-f0-9]{40}$ ]] || [ "$GITHUB_SHA" != "$VERIFIER_COMMIT" ] || ! [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::verification requires exact qualified main source and explicit Worker commit"
            exit 1
          fi
          case "$MODE" in
            inspect|inspect-public) ;;
            inventory|probe)
              if ! [[ "$EXPECTED_APP_VERSION" =~ ^[0-9]+$ ]] || [ -z "$EXPECTED_IMAGE" ]; then
                echo "::error::inventory/probe requires independently qualified application version and image pins"
                exit 1
              fi ;;
            *) echo "::error::unknown verification mode"; exit 1 ;;
          esac
          if [ -z "$SWITCHBOARD_DEPLOY_PROFILE" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$SANDBOX_TOKEN" ]; then
            echo "::error::verification needs the existing installation profile and read credentials"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: mint the configuration repository read token
        id: infra-token
        if: vars.CONFIG_REPO_NAME != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CONFIG_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONFIG_REPO_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONFIG_REPO_OWNER }}
          repositories: ${{ vars.CONFIG_REPO_NAME }}
          permission-contents: read
      - name: verify without uploading
        env:
          CONFIG_REPO_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$MODE" = inspect-public ]; then
            npm run --silent cli -- deploy inspect --public-metadata --expected-commit "$EXPECTED_COMMIT" --json | tee "$RUNNER_TEMP/sandbox-observation.json"
            node -e 'try { const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (r.ok !== true || r.publicMetadata?.complete !== true || r.inventoryComplete !== false || r.live !== false || r.targetVerified !== false || r.appVersion !== null || r.imageDigest !== null) process.exit(1); } catch { process.exit(1); }' "$RUNNER_TEMP/sandbox-observation.json"
          elif [ "$MODE" = inspect ]; then
            npm run --silent cli -- deploy inspect --expected-commit "$EXPECTED_COMMIT" --json | tee "$RUNNER_TEMP/sandbox-observation.json"
            node -e 'try { const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (r.ok !== true || r.inventoryComplete !== true || r.live !== false || r.targetVerified !== false) process.exit(1); } catch { process.exit(1); }' "$RUNNER_TEMP/sandbox-observation.json"
          else
            args=(deploy verify --expected-commit "$EXPECTED_COMMIT" --expected-app-version "$EXPECTED_APP_VERSION" --expected-image "$EXPECTED_IMAGE" --json)
            if [ "$MODE" = inventory ]; then args+=(--inventory-only); fi
            npm run --silent cli -- "${args[@]}" | tee "$RUNNER_TEMP/sandbox-observation.json"
          fi
      - name: bounded verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sandbox-observation.json
            ${{ runner.temp }}/paging-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore
