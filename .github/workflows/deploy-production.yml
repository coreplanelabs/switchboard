# Production deploy — the one path (features/release-and-deploy.md items 2–3,
# 9–11). release-please.yml calls this when a release is cut; a maintainer can
# dispatch it from main. Either way it runs the registry's `deploy all` — the
# same pre-checks, order, preflights and live gate an operator's laptop used
# to run — with `--affected` by default, so only the Workers whose inputs the
# release changed roll (judged per Worker against the commit it is serving).
#
# Secrets (repository secrets, set once by a maintainer — never by code):
#   CLOUDFLARE_DEPLOY_TOKEN  wrangler's credential for the four runtime Workers on
#                         the coreplane-infra account. Its own token, distinct
#                         from the docs job's: Account → Workers Scripts: Edit,
#                         Containers: Edit, Workers R2 Storage: Edit, Account
#                         Settings: Read; Zone coreplanelabs.dev → Workers
#                         Routes: Edit, DNS: Edit (the custom domains). The
#                         v0.2.1 deploy (run 34162851123) proved a token without
#                         the Containers scope deploys the memory Worker and then
#                         can never pass the bot's preflight; `deploy all` now
#                         checks these capabilities before any Worker deploys.
#   CLOUDFLARE_API_TOKEN  fallback while CLOUDFLARE_DEPLOY_TOKEN is unset (the
#                         docs Worker's narrower token)
#   RESIDENT_READ_TOKEN   the resident preflight reads GET /residents with it;
#                         read scope is enough (any of the three bearers works)
#   SANDBOX_TOKEN         optional: lets --affected read the sandbox's live
#                         commit; without it the sandbox falls back to the last
#                         release tag (and is "unsure" — deployed — before the
#                         first tag exists)
name: deploy-production

on:
  workflow_call:
    inputs:
      targets:
        description: "`affected` (default), `all`, or a comma list of Workers (memory,bot,resident,sandbox)"
        type: string
        default: affected
      force:
        description: Bypass the bot/resident preflights — in-flight runs are SIGTERM-drained and killed at the drain deadline
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      targets:
        description: "`affected` (default), `all`, or a comma list of Workers (memory,bot,resident,sandbox)"
        type: string
        default: affected
      force:
        description: Bypass the bot/resident preflights — in-flight runs are SIGTERM-drained and killed at the drain deadline
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.targets }}
    runs-on: ubuntu-latest
    # One production deploy at a time, in order, never cancelled: a second
    # deploy landing on a draining bot container kills its runs
    # (slack-channel.md item 8). Job-level so it holds when this workflow is
    # called from release-please.yml as well as when it is dispatched.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # GitHub's own deployment records (`gh api repos/…/deployments?environment=production`).
    environment: production
    # A full preflight wait (--wait-max 45) plus the bot's drain deadline
    # (15 min) plus cold start, with room for the image builds.
    timeout-minutes: 120
    env:
      # wrangler reads CLOUDFLARE_API_TOKEN; it is the deploy token when one exists.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_TOKEN_SOURCE: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN && 'CLOUDFLARE_DEPLOY_TOKEN' || 'CLOUDFLARE_API_TOKEN (the docs token — fallback)' }}
      RESIDENT_READ_TOKEN: ${{ secrets.RESIDENT_READ_TOKEN }}
      SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
      CI: "1"
    steps:
      # A dispatch from a branch would deploy that branch's tree. Refuse, loudly.
      - name: only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy-production runs only from main — got ${GITHUB_REF}. Nothing was deployed."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: --affected diffs against the commit each Worker
          # serves and falls back to the last `v*` tag before HEAD.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: the credentials this run has
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::no Cloudflare token — add CLOUDFLARE_DEPLOY_TOKEN as a repository secret (see the header of this workflow)"; exit 1; fi
          echo "Cloudflare credential: $DEPLOY_TOKEN_SOURCE"
          if [ "${DEPLOY_TOKEN_SOURCE#CLOUDFLARE_API_TOKEN}" != "$DEPLOY_TOKEN_SOURCE" ]; then echo "::warning::deploying with the docs Worker's token — it may lack the Containers/R2 scopes; deploy all checks before touching a Worker"; fi
          if [ -z "$RESIDENT_READ_TOKEN" ]; then echo "::warning::RESIDENT_READ_TOKEN is not set — a resident step would be refused before anything deploys"; fi
          if [ -z "$SANDBOX_TOKEN" ]; then echo "::notice::SANDBOX_TOKEN is not set — the sandbox is judged against the last release tag, not what it serves"; fi
      - name: the selection
        id: selection
        env:
          TARGETS: ${{ inputs.targets }}
          FORCE: ${{ inputs.force }}
        run: |
          case "$TARGETS" in
            affected|"") args="--affected" ;;
            all) args="" ;;
            *) args="--only $TARGETS" ;;
          esac
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "deploy all $args"
      # The plan first — into the log and the job summary — so the run is
      # readable before wrangler prints a word. `--allow-branch`: this job
      # deploys exactly the commit that triggered it (the release commit, or
      # main at dispatch time); origin/main may already have moved on by the
      # time the checkout happens, and that must not refuse the release.
      - name: plan
        env:
          ARGS: ${{ steps.selection.outputs.args }}
          TARGETS: ${{ inputs.targets }}
        run: |
          # The plan files live OUTSIDE the checkout: `deploy all` refuses a
          # working tree that is not clean (wrangler builds the current tree), and
          # an untracked plan.json in the repo root is exactly that (the first
          # release deploy, run 34161067561, refused itself this way).
          # shellcheck disable=SC2086 — $ARGS is a flag list built above, split on purpose
          npm run --silent cli -- deploy plan $ARGS --allow-branch --json > "$RUNNER_TEMP/plan.json"
          npm run --silent cli -- deploy plan $ARGS --allow-branch | tee "$RUNNER_TEMP/plan.txt"
          {
            echo "## Production deploy — \`${GITHUB_SHA:0:7}\` (${TARGETS:-affected})"
            echo
            if jq -e '.affected' "$RUNNER_TEMP/plan.json" > /dev/null; then jq -r '.affected.markdown' "$RUNNER_TEMP/plan.json"; echo; fi
            echo '<details><summary>plan</summary>'
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          # Prove it: the tree `deploy all` is about to build is the commit, nothing else.
          git status --porcelain
      - name: deploy
        env:
          ARGS: ${{ steps.selection.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          npm run --silent cli -- deploy all $ARGS --allow-branch --wait-max 45
      # What production serves now, whatever happened above — the receipt.
      - name: what is live
        if: always()
        run: |
          {
            echo
            echo "### Live after this run"
            echo
            echo "| Worker | build.commit |"
            echo "|---|---|"
            for w in switchboard switchboard-memory switchboard-resident; do
              commit=$(curl -s --max-time 20 "https://$w.coreplanelabs.dev/healthz" | jq -r '.build.commit // "?"' 2>/dev/null || echo "?")
              echo "| $w | \`${commit:0:7}\` |"
            done
            if [ -n "$SANDBOX_TOKEN" ]; then
              commit=$(curl -s --max-time 20 -H "authorization: Bearer $SANDBOX_TOKEN" https://switchboard-sandbox.coreplanelabs.dev/healthz | jq -r '.build.commit // "?"' 2>/dev/null || echo "?")
              echo "| switchboard-sandbox | \`${commit:0:7}\` |"
            else
              echo "| switchboard-sandbox | (no SANDBOX_TOKEN — not read) |"
            fi
            echo
            echo "Deployed commit: \`${GITHUB_SHA:0:7}\`. A selected Worker is live when its commit matches; a skipped one keeps its previous commit by design."
          } >> "$GITHUB_STEP_SUMMARY"
