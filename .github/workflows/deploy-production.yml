# Production deploy — the one path (docs/reference/specs/release-and-deploy.md items 2–3,
# 9–11, 27), reusable from any repository. release-please.yml calls it when a
# release is cut; a maintainer can dispatch it from main; an operator's own
# repository calls it from its CI (docs/how-to/deploy.md → Deploy from your CI).
# Either way it runs the registry's `deploy all` — the same pre-checks, order,
# preflights and live gate an operator's laptop used to run — with `--affected`
# by default, so only the Workers whose inputs changed roll (judged per Worker
# against the commit it is serving).
#
# Two ways to reach the CLI (the `cli` input):
#   checkout  the default — this repository's own release, and a fork's: the
#             calling repository is checked out (it IS this repository), `npm ci`,
#             and every command is `npm run --silent cli --` on that tree, so the
#             release deploys exactly the commit that triggered it.
#   package   an operator's repository: nothing of this repository is checked
#             out. Node is set up at the version the CLI's own `engines` names and
#             every command is `npx --yes <the published package>@<version>` —
#             `version` from the input, else the caller's tag without its `v`
#             (`v1.13.0` → `1.13.0`); never `latest`, so every run says which
#             release it deployed. The caller's own repository is checked out
#             only when the profile is a path in it; a `github://` or `op://`
#             profile needs no checkout at all.
#
# Images (`copy-images`): a profile whose Workers run the images the release
# published (`images: registry`) needs them copied into its account's registry
# once per version — `deploy images`, run here BEFORE the plan, since a
# registry-mode plan refuses a Worker whose copy is absent. The profile decides,
# not this file: the command copies what a `registry` profile lacks and answers
# a `build` profile (this repository's own, which wrangler builds at deploy
# time) with nothing to copy, reading nothing. `auto` (the default) runs it;
# `never` skips it. GitHub's runners carry Docker, which the copy needs, so
# nothing is installed for it.
#
# A busy bot is not busy (docs/reference/specs/release-and-deploy.md item 13). Since the
# run ledger's handoff (run-history item 39) the bot hands its runs to the next
# container on SIGTERM and exits within seconds, so the bot preflight no longer
# refuses for runs in flight and this job never waits on them or re-dispatches
# itself. The preflight still refuses while a container rollout is in progress
# (`deploy all` waits that out for its default budget) and fails closed when
# the bot cannot be consulted; any failure is red, for a person.
#
# Secrets — declared below so a caller in another repository passes them by
# name (`secrets:`); this repository's own call passes `secrets: inherit`. Set
# once by a maintainer, never by code:
#   CLOUDFLARE_DEPLOY_TOKEN  wrangler's credential for the four runtime Workers on
#                         the profile's account. Its own token, distinct from
#                         the docs job's: Account → Workers Scripts: Edit,
#                         Containers: Edit, Workers R2 Storage: Edit, Account
#                         Settings: Read; the profile's zone → Workers Routes:
#                         Edit, DNS: Edit (the custom domains). A token without
#                         the Containers scope deploys the memory Worker and then
#                         can never pass the bot's preflight, so `deploy all`
#                         checks these capabilities before any Worker deploys.
#   CLOUDFLARE_API_TOKEN  fallback while CLOUDFLARE_DEPLOY_TOKEN is unset (the
#                         docs Worker's narrower token)
#   RESIDENT_READ_TOKEN   the resident preflight reads GET /residents with it;
#                         read scope is enough (any of the three bearers works)
#   MEMORY_TOKEN          the state Worker's bearer: `deploy all` pushes the
#                         bot's config to it as the `base` document right before
#                         the bot step (the same value the Workers hold); a bot
#                         step is refused before anything deploys without it
#   SANDBOX_TOKEN         required whenever the sandbox is selected: its live
#                         gate reads GET /healthz and probes POST /exec with it
#                         (a sandbox step is refused before anything deploys
#                         without it); it also lets --affected read the
#                         sandbox's live commit instead of falling back to the
#                         last release tag
#   CONFIG_REPO_APP_CLIENT_ID, CONFIG_REPO_APP_PRIVATE_KEY  a GitHub App that can
#                         read the configuration repository a `github://` profile
#                         (and its `configSource`) names — the token minted from
#                         it is CONFIG_REPO_TOKEN for every command. A profile
#                         that is a path in the calling repository needs neither.
#   OP_SERVICE_ACCOUNT_TOKEN  this installation's alternative to handing the App
#                         in: its client id and private key are loaded from the
#                         secrets manager when no client id was passed.
#
# Variables — the CALLING repository's variables (where THAT installation's
# profile lives; nothing in the tree names an installation):
#   SWITCHBOARD_DEPLOY_PROFILE  the deployment profile `deploy all` reads when the
#                         `profile` input is empty — a
#                         `github://<owner>/<repo>/<path>@<ref>` reference to a
#                         private configuration repository (or any form the CLI
#                         takes); the run refuses without one
#   CONFIG_REPO_OWNER, CONFIG_REPO_NAME  the repository that reference names, so
#                         the App token minted below can read exactly it; unset,
#                         no token is minted (a path profile needs none)
name: deploy-production

on:
  workflow_call:
    inputs:
      targets:
        description: "`affected` (default), `all`, or a comma list of Workers (memory,bot,resident,sandbox)"
        type: string
        default: affected
      force:
        description: Bypass the bot/resident preflights — deploy over a rollout in progress, or blind when a bot cannot be consulted (in-flight bot runs hand off regardless)
        type: boolean
        default: false
      profile:
        description: "The deployment profile `deploy all` reads — a path in the calling repository, or a `github://<owner>/<repo>/<path>@<ref>` / `op://` reference; empty: the caller's SWITCHBOARD_DEPLOY_PROFILE repository variable"
        type: string
        default: ""
      cli:
        description: "`checkout` (default): `npm run --silent cli --` on the checked-out repository — this repository's own release; `package`: `npx --yes <the published package>@<version>` with nothing of this repository checked out — an operator's repository"
        type: string
        default: checkout
      version:
        description: "`package` mode only: the published CLI version to deploy with (`1.13.0`); empty: the caller's tag without its `v`. Never `latest`."
        type: string
        default: ""
      copy-images:
        description: "`auto` (default): run `deploy images` before the plan — it copies what a `registry`-mode profile lacks and does nothing for a `build`-mode one; `never`: skip it"
        type: string
        default: auto
    secrets:
      CLOUDFLARE_DEPLOY_TOKEN:
        required: false
        description: wrangler's credential for the runtime Workers on the profile's account (see the header)
      CLOUDFLARE_API_TOKEN:
        required: false
        description: fallback while CLOUDFLARE_DEPLOY_TOKEN is unset
      MEMORY_TOKEN:
        required: false
        description: the state Worker's bearer — the config push before the bot step
      RESIDENT_READ_TOKEN:
        required: false
        description: the resident preflight's read bearer
      SANDBOX_TOKEN:
        required: false
        description: the sandbox live gate's bearer
      CONFIG_REPO_APP_CLIENT_ID:
        required: false
        description: a GitHub App that reads the configuration repository a `github://` profile names
      CONFIG_REPO_APP_PRIVATE_KEY:
        required: false
        description: that App's private key
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false
        description: this installation's secrets manager, holding the App when no client id is passed
  workflow_dispatch:
    inputs:
      targets:
        description: "`affected` (default), `all`, or a comma list of Workers (memory,bot,resident,sandbox)"
        type: string
        default: affected
      force:
        description: Bypass the bot/resident preflights — deploy over a rollout in progress, or blind when a bot cannot be consulted (in-flight bot runs hand off regardless)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.targets }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One production deploy at a time, in order, never cancelled: a second
    # rollout landing on one in progress is refused by the bot preflight
    # (slack-channel.md item 8), so serialize here rather than wait there.
    # Job-level so it holds when this workflow is called from
    # release-please.yml as well as when it is dispatched.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # GitHub's own deployment records (`gh api repos/…/deployments?environment=production`).
    environment: production
    # The image builds, the preflight wait for a rollout still settling (10 min
    # by default), and the live gates (the drain deadline a non-resumable run
    # may still use in full, plus a cold start).
    timeout-minutes: 90
    env:
      # wrangler reads CLOUDFLARE_API_TOKEN; it is the deploy token when one exists.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_TOKEN_SOURCE: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN && 'CLOUDFLARE_DEPLOY_TOKEN' || 'CLOUDFLARE_API_TOKEN (the docs token — fallback)' }}
      RESIDENT_READ_TOKEN: ${{ secrets.RESIDENT_READ_TOKEN }}
      MEMORY_TOKEN: ${{ secrets.MEMORY_TOKEN }}
      SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      # The profile (and, through its `configSource`, the bot's config): the
      # `profile` input, else the calling repository's variable. A `github://`
      # profile is read with CONFIG_REPO_TOKEN, the App token minted below.
      SWITCHBOARD_DEPLOY_PROFILE: ${{ inputs.profile || vars.SWITCHBOARD_DEPLOY_PROFILE }}
      # The App is handed in as two secrets, or — this installation — loaded
      # from the secrets manager when no client id was handed in.
      LOAD_APP_FROM_VAULT: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.CONFIG_REPO_APP_CLIENT_ID == '' }}
      WRANGLER_SEND_METRICS: "false"
      CI: "1"
      # A stalled npm-cache segment gives up after 1 min, not 10 (see ci.yml).
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
    steps:
      # A dispatch from a branch would deploy that branch's tree. Refuse, loudly.
      # (`package` mode deploys a published version, not a tree: no guard.)
      - name: only from main
        if: inputs.cli != 'package' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy-production runs only from main — got ${GITHUB_REF}. Nothing was deployed."
          exit 1
      # One command word for every step below: the checked-out tree's CLI, or
      # the published package at one version. `label` names what this run
      # deploys in the job summary — the commit, or the package at its version.
      - name: the CLI
        id: cli
        env:
          MODE: ${{ inputs.cli }}
          VERSION: ${{ inputs.version }}
          COPY_IMAGES: ${{ inputs.copy-images }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$COPY_IMAGES" in
            auto|never|"") ;;
            *) echo "::error::copy-images must be auto or never — got '$COPY_IMAGES'. Nothing was deployed."; exit 1 ;;
          esac
          case "$MODE" in
            checkout|"")
              echo "cli=npm run --silent cli --" >> "$GITHUB_OUTPUT"
              echo "label=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
              echo "the checkout's CLI at ${GITHUB_SHA:0:7}" ;;
            package)
              v="$VERSION"
              if [ -z "$v" ] && [ "$REF_TYPE" = "tag" ]; then v="${REF_NAME#v}"; fi
              case "$v" in
                [0-9]*.[0-9]*.[0-9]*) ;;
                *) echo "::error::package mode needs the CLI's version — pass \`version\` (1.13.0) or run from a tag (v1.13.0); got '${v:-nothing}'. Nothing was deployed."; exit 1 ;;
              esac
              echo "cli=npx --yes @coreplane/switchboard@$v" >> "$GITHUB_OUTPUT"
              echo "label=@coreplane/switchboard@$v" >> "$GITHUB_OUTPUT"
              echo "the published CLI at $v — nothing of the repository is checked out" ;;
            *) echo "::error::cli must be checkout or package — got '$MODE'. Nothing was deployed."; exit 1 ;;
          esac
      # The calling repository: in `checkout` mode it is this repository and
      # the tree `deploy all` deploys; in `package` mode only a profile that is
      # a path inside it wants it on disk. A `github://` or `op://` profile is
      # read over the network and the operator's directory stays empty. There is
      # no `repository:` here — this workflow never checks out ANOTHER repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.cli != 'package' || !(startsWith(env.SWITCHBOARD_DEPLOY_PROFILE, 'github://') || startsWith(env.SWITCHBOARD_DEPLOY_PROFILE, 'op://'))
        with:
          # Full history + tags: --affected diffs against the commit each Worker
          # serves and falls back to the last `v*` tag before HEAD.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.cli != 'package'
        with:
          node-version-file: .nvmrc
          cache: npm
      # No `.nvmrc` without a checkout: the version the published CLI's own
      # `engines` names (packages/switchboard/package.json), held equal by a test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.cli == 'package'
        with:
          node-version: 24
      - run: npm ci
        if: inputs.cli != 'package'
      # The profile and config are read from the configuration repository with
      # an App token that can read exactly that repository — the same App
      # release-please.yml acts as, minted here so a dispatched run has it too.
      - name: load the App's credentials
        if: env.LOAD_APP_FROM_VAULT == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_CLIENT_ID: op://CI/coreplane-bot/client-id
          APP_PRIVATE_KEY: op://CI/coreplane-bot/private-key
      - name: mint the App token that reads the configuration repository
        id: infra-token
        if: vars.CONFIG_REPO_NAME != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID || secrets.CONFIG_REPO_APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY || secrets.CONFIG_REPO_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONFIG_REPO_OWNER }}
          repositories: ${{ vars.CONFIG_REPO_NAME }}
          permission-contents: read
      - name: the credentials this run has
        run: |
          if [ -z "$SWITCHBOARD_DEPLOY_PROFILE" ]; then echo "::error::no deployment profile — pass the \`profile\` input or set the repository variable SWITCHBOARD_DEPLOY_PROFILE (see the header of this workflow). Nothing was deployed."; exit 1; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::no Cloudflare token — add CLOUDFLARE_DEPLOY_TOKEN as a repository secret (see the header of this workflow)"; exit 1; fi
          echo "Cloudflare credential: $DEPLOY_TOKEN_SOURCE"
          if [ "${DEPLOY_TOKEN_SOURCE#CLOUDFLARE_API_TOKEN}" != "$DEPLOY_TOKEN_SOURCE" ]; then echo "::warning::deploying with the docs Worker's token — it may lack the Containers/R2 scopes; deploy all checks before touching a Worker"; fi
          if [ -z "$RESIDENT_READ_TOKEN" ]; then echo "::warning::RESIDENT_READ_TOKEN is not set — a resident step would be refused before anything deploys"; fi
          if [ -z "$MEMORY_TOKEN" ]; then echo "::warning::MEMORY_TOKEN is not set — a bot step would be refused before anything deploys (deploy all pushes the bot's config to the state Worker with it)"; fi
          if [ -z "$SANDBOX_TOKEN" ]; then echo "::warning::SANDBOX_TOKEN is not set — a sandbox step would be refused before anything deploys, and --affected judges the sandbox against the last release tag, not what it serves"; fi
      - name: the selection
        id: selection
        env:
          TARGETS: ${{ inputs.targets }}
          FORCE: ${{ inputs.force }}
        run: |
          case "$TARGETS" in
            affected|"") args="--affected" ;;
            all) args="" ;;
            *) args="--only $TARGETS" ;;
          esac
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "deploy all $args"
      # Once per version, before the plan: the release's images into the account
      # registry (pull from the public registry, push with wrangler — the runner's
      # Docker does both). The profile decides — a `build`-mode profile has nothing
      # to copy and nothing is read — and a copy already present is skipped by name.
      - name: copy the release's images into the account registry
        if: inputs.copy-images != 'never'
        env:
          CLI: ${{ steps.cli.outputs.cli }}
          CONFIG_REPO_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          # shellcheck disable=SC2086
          $CLI deploy images
      # The plan next — into the log and the job summary — so the run is
      # readable before wrangler prints a word. `--allow-branch`: this job
      # deploys exactly the commit that triggered it (the release commit, or
      # main at dispatch time); origin/main may already have moved on by the
      # time the checkout happens, and that must not refuse the release. From
      # the package there is no tree and the flag is inert.
      - name: plan
        env:
          CLI: ${{ steps.cli.outputs.cli }}
          LABEL: ${{ steps.cli.outputs.label }}
          ARGS: ${{ steps.selection.outputs.args }}
          TARGETS: ${{ inputs.targets }}
          CONFIG_REPO_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          # The plan files live OUTSIDE the checkout: `deploy all` refuses a
          # working tree that is not clean (wrangler builds the current tree), and
          # an untracked plan.json in the repo root is exactly that.
          # $CLI is a command word list and $ARGS a flag list, split on purpose (here and below).
          # shellcheck disable=SC2086
          $CLI deploy plan $ARGS --allow-branch --json > "$RUNNER_TEMP/plan.json"
          # shellcheck disable=SC2086
          $CLI deploy plan $ARGS --allow-branch | tee "$RUNNER_TEMP/plan.txt"
          {
            echo "## Production deploy — \`$LABEL\` (${TARGETS:-affected})"
            echo
            if jq -e '.affected' "$RUNNER_TEMP/plan.json" > /dev/null; then jq -r '.affected.markdown' "$RUNNER_TEMP/plan.json"; echo; fi
            echo '<details><summary>plan</summary>'
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      # Prove it: the tree `deploy all` is about to build is the commit, nothing else.
      - name: the tree is the commit
        if: inputs.cli != 'package'
        run: git status --porcelain
      - name: deploy
        id: deploy
        env:
          CLI: ${{ steps.cli.outputs.cli }}
          ARGS: ${{ steps.selection.outputs.args }}
          CONFIG_REPO_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          # Any non-zero exit is a real failure and fails here: since the
          # handoff (run-history item 39) a bot with runs in flight is not busy.
          # shellcheck disable=SC2086
          $CLI deploy all $ARGS --allow-branch
      # What production serves now, whatever happened above — the receipt.
      - name: what is live
        if: always()
        env:
          CLI: ${{ steps.cli.outputs.cli }}
          LABEL: ${{ steps.cli.outputs.label }}
          CONFIG_REPO_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          # Every Worker the profile has, with its /healthz and — for one whose
          # health route needs a bearer — the env var holding it, from the plan;
          # no hostname is typed here. The plan is read before the summary block
          # so its failure is a workflow annotation (a `::warning::` only counts
          # on stdout) while the table below still shows the gap.
          plan_ok=true
          # shellcheck disable=SC2086
          if ! $CLI deploy plan --allow-branch --json > "$RUNNER_TEMP/fleet.json" 2> "$RUNNER_TEMP/fleet.err"; then
            plan_ok=false
            echo "::warning::the live table could not read the deployment profile — deploy plan failed: $(tr '\n' ' ' < "$RUNNER_TEMP/fleet.err")"
            echo '{"steps":[]}' > "$RUNNER_TEMP/fleet.json"
          fi
          {
            echo
            echo "### Live after this run"
            echo
            echo "| Worker | build.commit |"
            echo "|---|---|"
            if [ "$plan_ok" = false ]; then echo "| (plan unreadable — see the warning) | ? |"; fi
            jq -r '.steps[] | [.script, (.healthUrl // .wakeUrl // .liveGate.healthUrl // ""), (.liveGate.bearerEnv // "")] | @tsv' "$RUNNER_TEMP/fleet.json" |
            while IFS=$'\t' read -r script url bearerEnv; do
              if [ -z "$url" ]; then echo "| $script | (no health URL in the plan) |"; continue; fi
              if [ -n "$bearerEnv" ] && [ -z "${!bearerEnv}" ]; then echo "| $script | (no $bearerEnv — not read) |"; continue; fi
              if [ -n "$bearerEnv" ]; then auth=(-H "authorization: Bearer ${!bearerEnv}"); else auth=(); fi
              # An unreachable Worker leaves jq with no input and no output — not an error — so default the empty answer too.
              commit=$(curl -s --max-time 20 "${auth[@]}" "$url" | jq -r '.build.commit // "?"' 2>/dev/null || true)
              c=${commit:-?}
              echo "| $script | \`${c:0:7}\` |"
            done
            echo
            echo "Deployed: \`$LABEL\`. A selected Worker is live when its commit matches; a skipped one keeps its previous commit by design."
          } >> "$GITHUB_STEP_SUMMARY"
