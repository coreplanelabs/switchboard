name: deploy staging
run-name: ${{ github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name != 'deploy:staging' && 'Staging label ignored' || 'Staging requested' }}

# The controller comes from the base branch. Current same-repository PR heads
# release heads owned by repository writers or installed write Apps deploy after validation.
# This explicitly authorizes candidate execution, after the writer/head gates,
# with staging-only secrets. No fork or production credential reaches deploy.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character source commit to deploy
        required: true
        type: string
      targets:
        description: all, affected, or comma-separated Worker names
        type: string
        default: affected
      pr:
        description: Pull request to validate before a branch test deployment
        type: string
      review_e2e:
        description: Run bounded live Review acceptance after full-stack deployment
        type: boolean
        default: false
      reset_e2e:
        description: Reset isolated staging data twice before product acceptance
        type: boolean
        default: false
      retain_maintenance:
        description: Keep selected staging maintenance held until explicit Admin release
        type: boolean
        default: false
      review_transport:
        description: Admission transport for the existing bounded Review check
        type: choice
        default: http
        options: [http, mcp]
      review_effort:
        description: Explicit Review effort (medium or high)
        type: string
        default: medium
      model:
        description: Optional per-request full model ref for acceptance (provider/model)
        type: string
      require_vouched_controls:
        description: Require recorded model controls without fallback warnings
        type: boolean
        default: false

env:
  STAGING_ACCEPTANCE_MODEL: ${{ inputs.model }}
  STAGING_REQUIRE_VOUCHED_CONTROLS: ${{ inputs.require_vouched_controls }}
  STAGING_RETAIN_MAINTENANCE: ${{ inputs.retain_maintenance }}
  STAGING_REVIEW_TRANSPORT: ${{ inputs.review_transport }}
  STAGING_REVIEW_EFFORT: ${{ inputs.review_effort }}

permissions:
  contents: read
  deployments: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'labeled' || github.event.label.name == 'deploy:staging'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.request.outputs.commit }}
      requested: ${{ steps.request.outputs.requested }}
      automatic: ${{ steps.request.outputs.automatic }}
      require_label: ${{ steps.request.outputs.require_label }}
    steps:
      - name: authorize and capture the candidate
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
          VALIDATE_PR: ${{ inputs.pr }}
          AUTOMATIC: ${{ github.event_name == 'pull_request_target' && github.event.action != 'labeled' }}
          RELEASE_BRANCH: release-please--branches--main--components--switchboard
        run: |
          require_label=false
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            require_label=$(jq -er 'if (.pull_request.labels | type) == "array" then ((.action == "labeled" and .label.name == "deploy:staging") or any(.pull_request.labels[]; .name == "deploy:staging")) | tostring else error("Missing PR labels") end' "$GITHUB_EVENT_PATH") || { echo '::error::Missing staging label metadata'; exit 1; }
          fi
          if [ "$AUTOMATIC" = true ]; then
            head_ref=$(jq -er '.pull_request.head.ref | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH") || { echo '::error::Missing release branch metadata'; exit 1; }
            if [ "$head_ref" != "$RELEASE_BRANCH" ]; then
              if [ "$require_label" = true ]; then
                AUTOMATIC=false
              else
                head_sha=$(jq -er '.pull_request.head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH") || { echo '::error::Missing staging head metadata'; exit 1; }
                # A same-head branch dispatch is an explicit request. A later PR
                # event must not replace its failed acceptance with "not required".
                history=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?event=workflow_dispatch&head_sha=$head_sha&per_page=1") || { echo '::error::Staging request history is unavailable'; exit 1; }
                prior_request=$(jq -er --arg sha "$head_sha" '.workflow_runs | if type == "array" then any(.[]; .event == "workflow_dispatch" and .head_sha == $sha) | tostring else error("Missing workflow runs") end' <<< "$history") || { echo '::error::Staging request history is unavailable'; exit 1; }
                if [ "$prior_request" = true ]; then
                  AUTOMATIC=false
                else
                  echo 'requested=false' >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
          fi
          if [ "$AUTOMATIC" != true ]; then
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
            case "$permission" in admin|maintain|write) ;; *) echo '::error::Staging deployment requires repository write access'; exit 1 ;; esac
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            head_repo=$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || { echo '::error::Fork deployments are refused'; exit 1; }
            commit=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
            number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.sha')
            [ "$current" = "$commit" ] || { echo '::error::PR head changed; this request cannot deploy'; exit 1; }
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              [[ "$VALIDATE_PR" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Branch testing requires its pull request'; exit 1; }
              current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$VALIDATE_PR" --jq 'select(.state == "open" and .head.repo.full_name == .base.repo.full_name) | .head.sha')
              [ "$current" = "$REQUESTED_COMMIT" ] && [ "$GITHUB_SHA" = "$REQUESTED_COMMIT" ] || { echo '::error::Branch test does not match its current PR head'; exit 1; }
            fi
            commit="$REQUESTED_COMMIT"
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::An exact source commit is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq .sha | { read -r actual; [ "$actual" = "$commit" ]; }
          echo "automatic=$AUTOMATIC" >> "$GITHUB_OUTPUT"
          echo "require_label=$require_label" >> "$GITHUB_OUTPUT"
          echo 'requested=true' >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  validate:
    needs: authorize
    if: needs.authorize.outputs.requested == 'true' && (github.event_name == 'pull_request_target' || inputs.pr != '')
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 40
    concurrency:
      group: staging-validation-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - id: validate
        run: npm run staging:validate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_COMMIT: ${{ needs.authorize.outputs.commit }}
          STAGING_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          STAGING_REQUIRE_LABEL: ${{ needs.authorize.outputs.require_label }}
          STAGING_AUTOMATIC: ${{ needs.authorize.outputs.automatic }}
          STAGING_ACTOR: ${{ github.actor }}

  deploy:
    name: staging / selected stack
    outputs:
      accepted: ${{ steps.e2e.outputs.accepted }}
    needs: [authorize, validate]
    if: always() && !cancelled() && needs.authorize.result == 'success' && needs.authorize.outputs.requested == 'true' && (needs.validate.result == 'skipped' || (needs.validate.result == 'success' && needs.validate.outputs.eligible == 'true'))
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: ${{ inputs.reset_e2e && 120 || 60 }}
    environment: staging
    concurrency:
      group: deploy-staging
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ needs.authorize.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: candidate/.nvmrc
      - run: npm ci
        working-directory: controller
      # Candidate scripts receive no deploy credentials during installation.
      - run: npm ci
      - name: require one original full-stack reset rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.reset_e2e
        env:
          TARGETS: ${{ inputs.targets }}
          RETAIN: ${{ inputs.retain_maintenance }}
        run: |
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] && [ "$TARGETS" = all ] && [ "$RETAIN" != true ] || { echo '::error::Reset rehearsal requires one original full-stack dispatch without retained maintenance'; exit 1; }
      - name: recheck the validated head before giving the candidate credentials
        id: recheck
        if: github.event_name == 'pull_request_target' || inputs.pr != ''
        working-directory: controller
        run: npm run staging:validate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_COMMIT: ${{ needs.authorize.outputs.commit }}
          STAGING_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          STAGING_REQUIRE_LABEL: ${{ needs.authorize.outputs.require_label }}
          STAGING_AUTOMATIC: ${{ needs.authorize.outputs.automatic }}
          STAGING_ACTOR: ${{ github.actor }}
          STAGING_VALIDATE_MODE: recheck
      - name: staging inputs are complete
        if: steps.recheck.outputs.eligible == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
        env:
          PROFILE: ${{ vars.SWITCHBOARD_STAGING_PROFILE }}
          STAGING_ACCOUNT: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          PRODUCTION_ACCOUNT: ${{ vars.SWITCHBOARD_PRODUCTION_ACCOUNT }}
          CF_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_DEPLOY_TOKEN }}
          MEMORY: ${{ secrets.STAGING_MEMORY_TOKEN }}
          RESIDENT_READ: ${{ secrets.STAGING_RESIDENT_READ_TOKEN }}
          RESIDENT_DRAIN: ${{ secrets.STAGING_RESIDENT_DRAIN_TOKEN }}
          SANDBOX: ${{ secrets.STAGING_SANDBOX_TOKEN }}
        run: |
          for name in PROFILE STAGING_ACCOUNT PRODUCTION_ACCOUNT CF_TOKEN MEMORY RESIDENT_READ RESIDENT_DRAIN SANDBOX; do
            [ -n "${!name}" ] || { echo "::error::Missing staging input: $name. Nothing deployed."; exit 1; }
          done
      - name: read the private staging configuration
        if: steps.recheck.outputs.eligible == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
        id: config-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.STAGING_CONFIG_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.STAGING_CONFIG_REPO_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONFIG_REPO_OWNER }}
          repositories: ${{ vars.CONFIG_REPO_NAME }}
          permission-contents: read
      - name: validate acceptance configuration before upload
        if: (steps.recheck.outputs.eligible == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')) && (github.event_name == 'pull_request_target' || inputs.pr != '' || inputs.review_e2e)
        env:
          SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_STAGING_PROFILE }}
          CONFIG_REPO_TOKEN: ${{ steps.config-token.outputs.token }}
          SMOKE_INGRESS_CONFIG: ${{ vars.STAGING_SMOKE_CONFIG }}
          SMOKE_INGRESS_ORIGIN: ${{ vars.STAGING_SMOKE_ORIGIN }}
          SMOKE_INGRESS_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
          SMOKE_ACCESS_CLIENT_ID: ${{ secrets.STAGING_SMOKE_ACCESS_CLIENT_ID }}
          SMOKE_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_SMOKE_ACCESS_CLIENT_SECRET }}
          SMOKE_EXPECTED_COMMIT: ${{ needs.authorize.outputs.commit }}
          SMOKE_MODEL: ${{ env.STAGING_ACCEPTANCE_MODEL }}
          SMOKE_REVIEW_TRANSPORT: ${{ env.STAGING_REVIEW_TRANSPORT }}
          SMOKE_REVIEW_EFFORT: ${{ env.STAGING_REVIEW_EFFORT }}
          SMOKE_SLACK_CONFIG: ${{ vars.STAGING_SLACK_SMOKE_CONFIG }}
          SMOKE_SLACK_USER_TOKEN: ${{ secrets.STAGING_SLACK_TEST_USER_TOKEN }}
        run: |
          plan_args=()
          if [ "$STAGING_RETAIN_MAINTENANCE" = true ]; then plan_args=(--retain-maintenance); fi
          echo 'Acceptance: preparing the deployment plan.'
          npm run --silent cli -- deploy plan --allow-branch --json "${plan_args[@]}" > "$RUNNER_TEMP/staging-fleet.json"
          echo 'Acceptance: checking live scenarios; phase changes follow.'
          smoke_args=(--model "${SMOKE_MODEL:-openai/gpt-6-luna}" --review-transport "${SMOKE_REVIEW_TRANSPORT:-http}" --review-effort "${SMOKE_REVIEW_EFFORT:-medium}")
          if [ "$STAGING_REQUIRE_VOUCHED_CONTROLS" = true ]; then smoke_args+=(--require-vouched-controls); fi
          npm run --silent smoke:ingress -- "$RUNNER_TEMP/staging-fleet.json" "$RUNNER_TEMP/staging-setup.json" --check --check-reader "${smoke_args[@]}"
      - name: recover the prior completed upload before a retry
        if: github.run_attempt > 1 && (steps.recheck.outputs.eligible == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr == ''))
        working-directory: controller
        env:
          SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_STAGING_PROFILE }}
          SWITCHBOARD_STAGING_ACCOUNT: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          SWITCHBOARD_PRODUCTION_ACCOUNT: ${{ vars.SWITCHBOARD_PRODUCTION_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_DEPLOY_TOKEN }}
          RESIDENT_READ_TOKEN: ${{ secrets.STAGING_RESIDENT_READ_TOKEN }}
          RESIDENT_DRAIN_TOKEN: ${{ secrets.STAGING_RESIDENT_DRAIN_TOKEN }}
          CONFIG_REPO_TOKEN: ${{ steps.config-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          preview="$RUNNER_TEMP/resident-recovery.json"
          npm run --silent staging:deploy -- --recover-resident --if-held --run "$GITHUB_RUN_ID" --attempt "$((GITHUB_RUN_ATTEMPT - 1))" --receipt "$preview"
          if [ -f "$preview" ]; then
            selected=$(jq -er '.hash' "$preview")
            npm run --silent staging:deploy -- --recover-resident --run "$GITHUB_RUN_ID" --attempt "$((GITHUB_RUN_ATTEMPT - 1))" --receipt "$preview" --apply "$selected"
          fi
      - name: check the prior staging rollout
        id: baseline
        if: steps.recheck.outputs.eligible == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=staging&per_page=2") || deployments='[]'
          current=$(jq -r '.[0].id // empty' <<< "$deployments")
          previous=$(jq -r '.[1].id // empty' <<< "$deployments")
          current_log=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$current/statuses" --jq '.[0].log_url // empty' 2>/dev/null) || current_log=''
          previous_status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$previous/statuses" 2>/dev/null) || previous_status='[]'
          previous_log=$(jq -r '.[0].log_url // empty' <<< "$previous_status")
          previous_run=${previous_log#*"/actions/runs/"}
          previous_run=${previous_run%%/*}
          previous_job=${previous_log#*"/job/"}
          previous_event=''
          previous_deploy=''
          if [[ "$previous_log" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* && "$previous_run" =~ ^[0-9]+$ && "$previous_job" =~ ^[0-9]+$ ]]; then
            previous_event=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run" --jq .event 2>/dev/null) || previous_event=''
            previous_steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$previous_job" 2>/dev/null) || previous_steps='{}'
            previous_deploy=$(jq -r '[.steps[]? | select(.name == "deploy the captured commit to staging" and .conclusion == "success")] | length == 1' <<< "$previous_steps")
          fi
          if [[ "$current_log" == *"/actions/runs/$GITHUB_RUN_ID/"* && "$previous_deploy" == true && "$previous_event" == pull_request_target ]]; then
            echo 'safe_affected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'safe_affected=false' >> "$GITHUB_OUTPUT"
            echo 'Prior staging rollout is not proven successful; the next affected request will deploy all Workers.'
          fi
      - name: deploy the captured commit to staging
        id: deploy
        if: steps.recheck.outputs.eligible == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
        env:
          SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_STAGING_PROFILE }}
          SWITCHBOARD_STAGING_ACCOUNT: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          SWITCHBOARD_PRODUCTION_ACCOUNT: ${{ vars.SWITCHBOARD_PRODUCTION_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_DEPLOY_TOKEN }}
          MEMORY_TOKEN: ${{ secrets.STAGING_MEMORY_TOKEN }}
          RESIDENT_READ_TOKEN: ${{ secrets.STAGING_RESIDENT_READ_TOKEN }}
          RESIDENT_DRAIN_TOKEN: ${{ secrets.STAGING_RESIDENT_DRAIN_TOKEN }}
          SANDBOX_TOKEN: ${{ secrets.STAGING_SANDBOX_TOKEN }}
          CONFIG_REPO_TOKEN: ${{ steps.config-token.outputs.token }}
          COMMIT: ${{ needs.authorize.outputs.commit }}
          TARGETS: ${{ inputs.reset_e2e && 'all' || inputs.targets || 'affected' }}
          SAFE_AFFECTED: ${{ steps.baseline.outputs.safe_affected }}
          REVIEW_ACCEPTANCE: ${{ github.event_name == 'pull_request_target' || inputs.pr != '' || inputs.review_e2e || inputs.reset_e2e }}
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
        run: |
          # /healthz can advance before a container rollout finishes.
          if [ "$STAGING_RETAIN_MAINTENANCE" = true ]; then
            echo 'Retained maintenance requires the full Resident deployment path; selecting all Workers.'
            TARGETS=all
          fi
          if [ "$TARGETS" = affected ] && [ "$SAFE_AFFECTED" != true ]; then
            echo 'Previous staging rollout is unproven; selecting all Workers.'
            TARGETS=all
          fi
          case "$TARGETS" in
            all) args=() ;;
            affected) args=(--affected) ;;
            *)
              [[ "$TARGETS" =~ ^(memory|bot|resident|sandbox)(,(memory|bot|resident|sandbox))*$ ]] || { echo '::error::Invalid targets'; exit 1; }
              args=(--only "$TARGETS") ;;
          esac
          if [ "$STAGING_RETAIN_MAINTENANCE" = true ]; then args+=(--retain-maintenance); fi
          if [ "$REVIEW_ACCEPTANCE" = true ]; then args+=(--selection-receipt "$RUNNER_TEMP/staging-selection.json"); fi
          set -o pipefail
          npm run --silent staging:deploy -- "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/staging-deploy.log"
          if [ "$REVIEW_ACCEPTANCE" = true ]; then
            expected_bot=$(jq -er --arg commit "$COMMIT" 'if .botSelected then $commit else .botBaseCommit end | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/staging-selection.json")
            echo "expected_bot=$expected_bot" >> "$GITHUB_OUTPUT"
          fi
      - name: prepare the original staging reset secret source
        if: github.event_name == 'workflow_dispatch' && inputs.reset_e2e && steps.deploy.outcome == 'success'
        env:
          RESET_ENVIRONMENT: staging
          RESET_ACCOUNT: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_STAGING_PROFILE }}
          SWITCHBOARD_STAGING_ACCOUNT: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          SWITCHBOARD_PRODUCTION_ACCOUNT: ${{ vars.SWITCHBOARD_PRODUCTION_ACCOUNT }}
          CONFIG_REPO_TOKEN: ${{ steps.config-token.outputs.token }}
          STAGING_RUNTIME_SECRETS_JSON: ${{ secrets.STAGING_RUNTIME_SECRETS_JSON }}
          MEMORY_TOKEN: ${{ secrets.STAGING_MEMORY_TOKEN }}
          SANDBOX_TOKEN: ${{ secrets.STAGING_SANDBOX_TOKEN }}
          RESIDENT_READ_TOKEN: ${{ secrets.STAGING_RESIDENT_READ_TOKEN }}
          RESIDENT_DRAIN_TOKEN: ${{ secrets.STAGING_RESIDENT_DRAIN_TOKEN }}
        run: npm run --silent staging:reset -- --prepare-secrets
      - name: rehearse two resets with preserved settings
        if: github.event_name == 'workflow_dispatch' && inputs.reset_e2e && steps.deploy.outcome == 'success'
        working-directory: candidate
        env:
          RESET_ENVIRONMENT: staging
          RESET_ACCOUNT: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_STAGING_PROFILE }}
          SWITCHBOARD_STAGING_ACCOUNT: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          SWITCHBOARD_PRODUCTION_ACCOUNT: ${{ vars.SWITCHBOARD_PRODUCTION_ACCOUNT }}
          CONFIG_REPO_TOKEN: ${{ steps.config-token.outputs.token }}
          SMOKE_INGRESS_CONFIG: ${{ vars.STAGING_SMOKE_CONFIG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_DEPLOY_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          CI: "1"
        run: npm run --silent staging:reset -- --directory "$RUNNER_TEMP/reset-rehearsal"
      - name: run live Review acceptance on the deployed stack
        id: e2e
        if: steps.deploy.outcome == 'success' && (github.event_name == 'pull_request_target' || inputs.pr != '' || inputs.review_e2e || inputs.reset_e2e)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.SWITCHBOARD_STAGING_ACCOUNT }}
          SWITCHBOARD_DEPLOY_PROFILE: ${{ vars.SWITCHBOARD_STAGING_PROFILE }}
          CONFIG_REPO_TOKEN: ${{ steps.config-token.outputs.token }}
          SMOKE_INGRESS_CONFIG: ${{ vars.STAGING_SMOKE_CONFIG }}
          SMOKE_INGRESS_ORIGIN: ${{ vars.STAGING_SMOKE_ORIGIN }}
          SMOKE_INGRESS_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
          SMOKE_ACCESS_CLIENT_ID: ${{ secrets.STAGING_SMOKE_ACCESS_CLIENT_ID }}
          SMOKE_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_SMOKE_ACCESS_CLIENT_SECRET }}
          SMOKE_INGRESS_THREAD: staging-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_EXPECTED_COMMIT: ${{ steps.deploy.outputs.expected_bot }}
          SMOKE_REQUIRE_SLACK_CONNECTION: "true"
          SMOKE_MODEL: ${{ env.STAGING_ACCEPTANCE_MODEL }}
          SMOKE_REVIEW_TRANSPORT: ${{ env.STAGING_REVIEW_TRANSPORT }}
          SMOKE_REVIEW_EFFORT: ${{ env.STAGING_REVIEW_EFFORT }}
          SMOKE_SLACK_CONFIG: ${{ vars.STAGING_SLACK_SMOKE_CONFIG }}
          SMOKE_SLACK_USER_TOKEN: ${{ secrets.STAGING_SLACK_TEST_USER_TOKEN }}
        run: |
          plan_args=()
          if [ "$STAGING_RETAIN_MAINTENANCE" = true ]; then plan_args=(--retain-maintenance); fi
          npm run --silent cli -- deploy plan --allow-branch --json "${plan_args[@]}" > "$RUNNER_TEMP/staging-fleet.json"
          smoke_args=(--model "${SMOKE_MODEL:-openai/gpt-6-luna}" --review-transport "${SMOKE_REVIEW_TRANSPORT:-http}" --review-effort "${SMOKE_REVIEW_EFFORT:-medium}")
          if [ "$STAGING_REQUIRE_VOUCHED_CONTROLS" = true ]; then smoke_args+=(--require-vouched-controls); fi
          npm run --silent smoke:ingress -- "$RUNNER_TEMP/staging-fleet.json" "$RUNNER_TEMP/staging-e2e.json" "${smoke_args[@]}"
          jq -e '.slackConnection.required == true and .slackConnection.connected == true and .slackConnection.checks == ((.scenarios | length) * 2)' "$RUNNER_TEMP/staging-e2e.json" > /dev/null
          if [ -n "$SMOKE_SLACK_CONFIG" ]; then
            jq -e '.slackCommand.outcome == "passed"' "$RUNNER_TEMP/staging-e2e.json" > /dev/null
          fi
          echo "accepted=true" >> "$GITHUB_OUTPUT"
      - name: staging deployment receipt
        if: always()
        env:
          COMMIT: ${{ needs.authorize.outputs.commit }}
        run: |
          printf 'Staging source: `%s`\n\n' "$COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Readiness and live Review acceptance: see deployment and E2E receipts.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-deploy.log
            ${{ runner.temp }}/staging-setup.json
            ${{ runner.temp }}/staging-fleet.json
            ${{ runner.temp }}/staging-e2e.json
            ${{ runner.temp }}/resident-recovery.json
            ${{ runner.temp }}/resident-recovery.json.apply.jsonl
            ${{ runner.temp }}/reset-rehearsal/staging-reset-e2e.json
          if-no-files-found: ignore

  acceptance:
    name: staging / live Review
    needs: [authorize, validate, deploy]
    if: always() && !cancelled() && (github.event_name == 'pull_request_target' || inputs.pr != '') && (github.event.action != 'labeled' || github.event.label.name == 'deploy:staging')
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    steps:
      - name: require deployment and a real posted Review
        env:
          REQUESTED: ${{ needs.authorize.outputs.requested }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ACCEPTED: ${{ needs.deploy.outputs.accepted }}
        run: |
          if [ "$AUTHORIZE_RESULT" = success ] && [ "$REQUESTED" = false ]; then
            echo 'Staging E2E is automatic for release PRs only. Not required for this ordinary PR; use deploy:staging or manual dispatch to request it.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$DEPLOY_RESULT" = success ] && [ "$ACCEPTED" = true ] || { echo '::error::Full-stack staging Review acceptance did not pass. See the deployment and E2E receipts.'; exit 1; }
          echo 'Full-stack staging deployment and live Review passed.' >> "$GITHUB_STEP_SUMMARY"
